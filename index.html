  if(P.hab.length>1){const used=new Set(),mix=[],lists=P.hab.map(h=>out.filter(x=>x.hs.includes(h)));
    for(let r=0;r<4;r++)lists.forEach(l=>{const x=l.find(y=>!used.has(y.a.id));if(x){used.add(x.a.id);mix.push(x)}});
    return [...mix,...out.filter(x=>!used.has(x.a.id))]}
  return out}

/* ---- ajuste de tarefa ---- */
function pTxt(a,k){const nat=pNat();
  if(!a||a._b||!a.r){return k==='regressao'?(nat?'Ofereça apoio ou flutuador, reduza a profundidade e divida o gesto em partes menores.':'Reduza espaço, velocidade ou número de comandos e demonstre antes de pedir.'):k==='progressao'?(nat?'Aumente a distância, retire o apoio ou combine duas habilidades.':'Aumente distância ou velocidade, adicione uma regra ou combine duas habilidades.'):(a&&a.d)||''}
  return k==='regressao'?a.r:k==='progressao'?a.p:a.d}
const pSugT=a=>{if(!a||!a.cx)return'base';const d=a.cx-pTarget();return d>=2?'regressao':d<=-2?'progressao':'base'};

/* ---- blocos ---- */
const pMinDef=()=>P.blocoMin||(pNat()?[6,8,18,8]:[10,10,20,10]);
function pBlocoAuto(a){const t=nrm((a&&a.gr||'')+' '+(a&&a.n||''));if(!a)return 2;
  if(/aquec|ambient|entrada gradual|chegada/.test(t))return 1;
  if(/relax|calma|volta|roda|cooperativ|final/.test(t)||/^rec/.test(a.sub||''))return 4;
  return a.cx<=2?2:3}
function pDistrib(items){const out={},n=items.length;if(!n)return out;
  const cx=a=>a?a.cx:2,lo=(x,y)=>cx(x[1])-cx(y[1]),cnt=b=>items.filter(([nm])=>out[nm]===b).length;
  items.forEach(([nm,a])=>{const f=pBlocoAuto(a);if(f===1||f===4)out[nm]=f});
  const rest=items.filter(([nm])=>!out[nm]).sort(lo),k=rest.length>=3?Math.max(1,Math.floor(rest.length/3)):0;
  rest.forEach(([nm],i)=>{out[nm]=i<k?2:3});
  if(!cnt(3)){const h=[...items].sort(lo).pop();out[h[0]]=3}
  if(n>=3&&!cnt(1)){const c=items.filter(([nm])=>out[nm]!==3||cnt(3)>1).sort(lo)[0];if(c)out[c[0]]=1}
  if(n>=4&&!cnt(4)){const c=items.filter(([nm])=>out[nm]!==1&&(out[nm]!==3||cnt(3)>1)).sort((x,y)=>((x[1]&&x[1].i==='baixa')?0:1)-((y[1]&&y[1].i==='baixa')?0:1)||lo(x,y))[0];if(c)out[c[0]]=4}
  return out}
function pAutoBlocos(all){alterPlan('P',st=>{st.ativMeta=st.ativMeta||{};const nm=st.atividades,get=n=>{const m=st.ativMeta[n]=st.ativMeta[n]||{id:'',min:'',adapt:''};return [n,(m.id&&achaAtv(m.id))||allActivities().find(x=>x.n===n)||null]};
  const items=nm.map(get),any=items.some(([n])=>st.ativMeta[n].bloco);
  if(all||!any){const d=pDistrib(items);items.forEach(([n])=>{st.ativMeta[n].bloco=d[n]})}
  else items.forEach(([n,a])=>{const m=st.ativMeta[n];if(!m.bloco){const f=pBlocoAuto(a);m.bloco=f===1||f===4?f:(a&&a.cx<=2?2:3)}});
  if(nm.length&&!nm.some(n=>st.ativMeta[n].bloco===3)){const h=[...items].sort((x,y)=>(x[1]?x[1].cx:2)-(y[1]?y[1].cx:2)).pop();st.ativMeta[h[0]].bloco=3}})}

/* ---- ações ---- */
function pSet(k,v){alterPlan('P',st=>{const ch=st[k]!==v;st[k]=v;if(ch&&((k==='faixa'&&st.tipo==='Funcional')||(k==='nivel'&&st.tipo==='Natação'))&&st.hab.length){st.hab=[];toast('Perfil alterado: as habilidades foram zeradas.')}})}
function pAluno(id,el){const old=String(P.aluno||''),nx=String(id||'');if(old===nx){render(true);return}

  clearPlanDraft('P');const f=newP(),a=alu(nx);f.tipo=P.tipo;f.aluno=nx;

  alterPlan('P',st=>{st.tipo=t;st.hab=[];st.atividades=[];st.ativMeta={};st.ctx=[];st.objetivo='';})}

function pCog(v){alterPlan('P',st=>{tg(st.cogs,v,3);st.cogOn=true})}
function pAtv(id){atvToggle(id,'P',0)}
function pTarSet(i,k){alterPlan('P',st=>{const n=st.atividades[i];if(n===undefined)return;st.ativMeta[n]=Object.assign({id:'',min:'',adapt:''},st.ativMeta[n],{tarefa:k})})}
function pTarAll(k){alterPlan('P',st=>{st.atividades.forEach(n=>{st.ativMeta[n]=Object.assign({id:'',min:'',adapt:''},st.ativMeta[n],{tarefa:k})})})}
function pBloco(i,b){alterPlan('P',st=>{const n=st.atividades[i];if(n===undefined)return;st.ativMeta[n]=Object.assign({id:'',min:'',adapt:''},st.ativMeta[n],{bloco:b})})}
function pMin(i,v){alterPlan('P',st=>{const m=[...(st.blocoMin||pMinDef())];m[i]=Math.max(0,parseInt(v)||0);st.blocoMin=m})}
function pGo(n){ps=Math.max(1,Math.min(8,n));if(ps===7)pAutoBlocos(false);else savePlanDraft('P');render();}
function pNext(d){const n=ps+d;if(d>0&&!pOk(ps))return;if(n===7&&d>0)pAutoBlocos(false);ps=Math.max(1,Math.min(8,n));savePlanDraft('P');render()}

/* ---- etapa 8: revisão e coerência ---- */
function pChecks(){const C=[],add=(lv,t,d,go)=>C.push({lv,t,d,go}),sel=P.atividades,acts=sel.map(n=>[n,pAt(n)]),a0=alu(P.aluno);
  /* objetivo e habilidades */

  add(P.hab.length>=1&&P.hab.length<=4?'ok':'warn','Habilidades prioritárias',P.hab.length?P.hab.join(', '):'Escolha de 1 a 4 habilidades.',3);
  const o=pObj();if(o&&P.hab.length){const g=pSkills(),aligned=P.hab.some(h=>g.some(gr=>gr[1].some(x=>x[0]===h)&&pSkillSug(gr[0],gr[1].find(x=>x[0]===h))));
    add(aligned||(!o[2]&&!o[3])?'ok':'warn','Objetivo × habilidades',aligned||(!o[2]&&!o[3])?'As habilidades escolhidas sustentam o objetivo.':'Nenhuma habilidade escolhida está ligada ao objetivo "'+o[0]+'". Revise o objetivo ou as habilidades.',3)}
  /* atividades × habilidades */
  if(sel.length&&P.hab.length){const unc=P.hab.filter(h=>!acts.some(([n,a])=>a&&habMatch(h,atvTxt(a))));
    add(unc.length?'warn':'ok','Habilidades × atividades',unc.length?'Sem atividade que trabalhe claramente: '+unc.join(', ')+'.':'Todas as habilidades prioritárias têm ao menos uma atividade.',5)}
  else add('warn','Atividades',sel.length?'Defina habilidades prioritárias.':'Nenhuma atividade escolhida.',5);
  /* atividades × nível */
  const lv=pLv(),fora=acts.filter(([n,a])=>{if(!a)return false;const L=scoreAtv(a,lv,{});return L!==-1&&L.s<0}).map(([n])=>n);
  add(fora.length?'warn':'ok','Atividades × nível do aluno',fora.length?'Fora da faixa/nível indicado: '+fora.join(', ')+'.':'Atividades compatíveis com '+(pLvl()||'o perfil')+'.',5);
  /* camada cognitiva */
  if(P.cogOn&&P.cogs.length){const sem=P.cogs.filter(c=>!acts.some(([n,a])=>a&&cogMatch(c,a)));
    add(sem.length?'info':'ok','Camada cognitiva',sem.length?'Nenhuma atividade traz "'+sem.join('", "')+'" na descrição: aplique como regra extra no Bloco 3 (veja os exemplos na etapa 4).':'Há atividade para cada função cognitiva escolhida.',sem.length?4:5)}
  /* tarefa × nível */
  const alta=acts.filter(([n,a])=>a&&a.cx-pTarget()>=2&&pTar(n)!=='regressao').map(([n])=>n),todas=sel.length>1&&sel.every(n=>pTar(n)==='progressao');
  add(alta.length||todas?'warn':'ok','Ajuste de tarefa',alta.length?'Complexidade acima do perfil sem regressão: '+alta.join(', ')+'.':todas?'Todas em progressão: prepare ao menos uma versão base.':'Regressão, base e progressão coerentes com o perfil.',6);
  /* estrutura */
  const sem=sel.filter(n=>!pMeta(n).bloco),vaz=[1,2,3,4].filter(b=>!sel.some(n=>+pMeta(n).bloco===b));
  add(sem.length?'warn':vaz.includes(3)?'warn':vaz.length?'info':'ok','Estrutura da aula',sem.length?'Sem bloco: '+sem.join(', ')+'.':vaz.includes(3)?'O Núcleo Principal (Bloco 3) está vazio.':vaz.length?'Blocos sem atividade: '+vaz.join(', ')+'. Pode ser intencional (ex.: só rotina de abertura).':'Os 4 blocos têm atividades.',7);
  /* intensidade × idade */
  const id=a0?idade(a0):null,altaI=acts.filter(([n,a])=>a&&a.i==='alta').length;
  if(id!=null&&id<=5&&sel.length&&altaI/sel.length>0.5)add('warn','Intensidade','Mais da metade das atividades é de alta intensidade para '+idTxt(a0)+'. Inclua pausas.',5);
  /* segurança e atenção */
  const cs=acts.filter(([n,a])=>a&&a.cs);if(pNat()&&cs.length)add('info','Segurança aquática',cs.length+' atividade(s) com cuidados de segurança: leia antes da aula ('+cs.map(([n])=>n).slice(0,3).join(', ')+(cs.length>3?'…':'')+').',5);
  if(a0&&a0.obs)add('info','Necessidades do aluno','Cadastro: '+a0.obs+'. Confirme se as atividades e os ajustes respeitam isso.',1);
  return C}
const pLvIc={ok:['✓','var(--g)'],warn:['!','var(--o)'],info:['i','var(--c)']};
function pS8(){const C=pChecks(),w=C.filter(c=>c.lv==='warn').length,a=alu(P.aluno),by=b=>P.atividades.filter(n=>(+pMeta(n).bloco||0)===b),mins=pMinDef();

  ${C.map(c=>`<div class="card !p-3 !mb-2 flex gap-3 items-start"><span class="shrink-0 grid place-items-center rounded-full text-white font-extrabold text-xs" style="width:24px;height:24px;background:${pLvIc[c.lv][1]}">${pLvIc[c.lv][0]}</span><div class="min-w-0 flex-1"><p class="text-sm font-extrabold leading-tight">${esc(c.t)}</p><p class="text-xs mt-0.5">${esc(c.d)}</p></div>${c.lv!=='ok'?`<button class="text-xs font-extrabold underline shrink-0" style="color:var(--b)" onclick="pGo(${c.go})">Ajustar</button>`:''}</div>`).join('')}

function saveP(){if(!pOk(8))return toast('Complete aluno, perfil, objetivo, habilidades e ao menos uma atividade.');
  const ids=[P.aluno,...(P.alunosExtras||[])].filter((v,i,a)=>v&&a.findIndex(x=>String(x)===String(v))===i),old=ld('b'),dados=semProf(P),mins=pMinDef();
  ['alunosExtras','blocoMin','ctx'].forEach(k=>delete dados[k]);
  if(pNat())delete dados.faixa;else delete dados.nivel;
  const det=[...P.ctx,...P.atividades.filter(n=>pTar(n)!=='base').map(n=>`${n}: ${TAREFA_N(pTar(n)).toLowerCase()}`)],

   blocos=PBLK.map((b,k)=>({n:k+1,nome:b[0],min:mins[k],atividades:P.atividades.filter(n=>+pMeta(n).bloco===k+1)})),
   C=pChecks(),rev={avisos:C.filter(c=>c.lv==='warn').map(c=>c.t+': '+c.d),em:new Date().toISOString()},
   base=Date.now(),data=new Date().toISOString(),objetivo=pObjLabel(),focos=pFocos();
  const clones=ids.map((id,i)=>{const s=alu(id);return {...JSON.parse(JSON.stringify(dados)),aluno:id,tipo:P.tipo,responsavel:responsavel(),focos,objetivo,objetivoCentral:P.objetivo,cog,det,ctx:[...P.ctx],blocos,revisao:rev,fluxo:2,alunoNome:s?.nome||'',id:base+i,data}});
  sv('b',[...clones,...old]);clearPlanDraft('P');toast(`${clones.length} planejamento(s) salvo(s). ${rev.avisos.length?rev.avisos.length+' ponto(s) de atenção registrado(s). ':''}Boa aula!`);
  P=newP();ps=1;render()}

/* ---- integração com o restante do app ---- */
function repetirUltima(id,tipo){const l=ld('b').filter(b=>String(b.aluno)===String(id)&&tp(b)===tipo).sort((x,y)=>String(y.data).localeCompare(String(x.data)))[0];if(!l)return;
  const b=newP();Object.keys(b).forEach(k=>{if(k in l&&k!=='ctx')b[k]=JSON.parse(JSON.stringify(l[k]))});
  b.aluno=String(id);b.tipo=tipo;b.atividades=[...(l.atividades||[])];b.ativMeta=JSON.parse(JSON.stringify(l.ativMeta||{}));
  b.ctx=Array.isArray(l.ctx)?[...l.ctx]:(l.fluxo?[]:[...(l.det||[])]);
  if(l.objetivoCentral)b.objetivo=l.objetivoCentral;
  if(l.cog&&!/^Sem desafio/.test(l.cog)){b.cogs=PCOG.map(c=>c[0]).filter(n=>String(l.cog).includes(n)||String(l.cog).toLowerCase().includes(n.split(' ')[0].toLowerCase()));b.cogOn=b.cogs.length>0}
  if(tipo==='Natação'){b.nivel=l.nivel||b.nivel}else{b.faixa=l.faixa||b.faixa}
  P=b;tab='plano';ps=l.fluxo?8:3;savePlanDraft('P');toast('Plano da última aula copiado. Revise e salve.');render()}
const _delStu0=delStu;delStu=function(id){const eh=String(P.aluno)===String(id);_delStu0(id);if(eh&&!alu(id)){P=newP();ps=1;clearPlanDraft('P');render()}};
const _verPlano0=verPlano;verPlano=function(id){_verPlano0(id);const b=ld('b').find(x=>String(x.id)===String(id));if(!b||!b.fluxo)return;
  const L=(t,v)=>v?`<p class="lb">${t}</p><p class="text-sm font-semibold">${v}</p>`:'',bl=(b.blocos||[]).map(x=>`<p class="text-sm font-semibold">${esc(x.nome)} · ${x.min} min${x.atividades.length?': '+esc(x.atividades.join(', ')):''}</p>`).join(''),
   h=L('Objetivo central',esc(b.objetivo||''))+(bl?`<p class="lb">Estrutura da aula</p>${bl}`:'')+((b.revisao&&b.revisao.avisos&&b.revisao.avisos.length)?`<p class="lb">Pontos de atenção na revisão</p>${b.revisao.avisos.map(x=>`<p class="text-xs">• ${esc(x)}</p>`).join('')}`:'');
  const el=document.querySelector('#modal .card');if(el)el.insertAdjacentHTML('afterend',h)};
const _planejado0=planejado;planejado=function(id){const h=_planejado0(id);const b=ld('b').find(x=>String(x.id)===String(id));if(!h||!b||!b.objetivo)return h;
  return h.replace('Planejado para esta aula</p>',`Planejado para esta aula</p><p class="text-xs mt-1"><b>Objetivo:</b> ${esc(b.objetivo)}</p>`)};
const _aulaAtiva0=aulaAtiva;aulaAtiva=function(id){_aulaAtiva0(id);const b=ld('b').find(x=>String(x.id)===String(id));if(!b||!b.blocos)return;
  const h=`<div class="card mt-3 !p-3"><p class="text-xs font-extrabold" style="color:var(--b)">Estrutura da aula</p>${b.objetivo?`<p class="text-sm mt-1"><b>Objetivo:</b> ${esc(b.objetivo)}</p>`:''}${b.blocos.map(x=>`<p class="text-sm mt-2"><b>${esc(x.nome)}</b> · ${x.min} min<br>${x.atividades.length?esc(x.atividades.join(' → ')):'<span class="hint">sem atividade</span>'}</p>`).join('')}</div>`;
  const cards=document.querySelectorAll('#modal .card');if(cards[0])cards[0].insertAdjacentHTML('afterend',h)};
['change','click'].forEach(ev=>document.addEventListener(ev,()=>{setTimeout(()=>{if(tab==='plano')savePlanDraft('P')},0)}));
addEventListener('beforeunload',()=>{if(tab==='plano')savePlanDraft('P')});

if(MODO_TESTE){const tb=$('#tbanner');if(tb)tb.classList.add('on')}
