ius:999px;padding:8px 11px;font-size:.72rem;font-weight:800;color:var(--t);min-height:38px}.skill-chip.on{background:var(--b);border-color:var(--b);color:#fff;box-shadow:0 5px 12px rgba(41,72,245,.2)}.lib-section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:color-mix(in srgb,var(--t) 66%,transparent);margin:16px 2px 7px}

<script>
/* HAPPYFIT KIDS · bases pedagógicas (edite aqui, sem mexer na lógica do app) */
const NIVT=[['Nível 1 · Exploração e organização rudimentar (0–2 anos)','Foco em organizar posturas, deslocamentos iniciais, alcance, manipulação e exploração do espaço. A idade orienta o ponto de partida, mas a habilidade observada define o próximo desafio.'],
['Nível 2 · Fundamental, Iniciação (3–5 anos)','Foco em ampliar estabilidade, locomoção e manipulação por meio de experiências variadas, sem antecipar exigências técnicas.'],
['Nível 3 · Fundamental, Transição (6–7 anos)','Foco em combinar habilidades, ajustar ritmo e direção e resolver tarefas motoras com maior precisão.'],
['Nível 4 · Especializada / Aplicação (8+ anos)','Foco em combinar habilidades com maior precisão, velocidade e complexidade, aproximando-as de contextos esportivos e funcionais.']];
const FAIXAS=NIVT.map(n=>n[0]);const TCL=['g','o','','p'];
const FOCOS=[['Estabilização','Postura, equilíbrio parado e em movimento, giros e aterrissagens','c'],['Locomoção','Deslocar-se, mudar o ritmo, saltar e mudar de direção','g'],['Manipulação','Coordenar olhos e mãos, controlar objetos, arremessar e receber','p']];
const TH=[
[['Estabilização',[['Controle de cabeça e tronco','Fortalece a postura e a sustentação do corpo.'],['Transferência de peso corporal','Prepara para passar o peso de um lado a outro e se deslocar.'],['Equilíbrio sentado e em pé','Ajuda o corpo a se endireitar e a se proteger ao perder o equilíbrio.'],['Rolamento e transição de posturas','Ensina a girar o tronco separado dos quadris.']]],

function sv(k,v){
  try{

    v.forEach(x=>{const id=String(x.id),o=old.get(id);seen.add(id);

}

function setLMode(m){LMODE=m;const up=m==='up';$('#lnw').classList.toggle('hidden',!up);$('#lnome').required=up;$('#lp').autocomplete=up?'new-password':'current-password';$('#lp').minLength=up?6:0;
  $('#lh').textContent=up?'Criar conta':'Entrar';$('#lhint').textContent=up?'Cadastre-se como professor(a) com e-mail e senha de no mínimo 6 caracteres.':'Acesso restrito à equipa HappyFit Kids.';$('#lb').textContent=up?'Criar conta e entrar':'Entrar';
  $('#lalt').textContent=up?'Já tem conta? Entrar':'Novo por aqui? Criar conta de professor';$('#lerr').textContent='';$('#lst').textContent='';
  [['#ltin','in'],['#ltup','up']].forEach(([i,k])=>{const b=$(i);b.style.background=k===m?'var(--b)':'';b.classList.toggle('text-white',k===m)})}
async function doSignUp(){const b=$('#lb'),er=$('#lerr'),nome=$('#lnome').value.trim().replace(/\s+/g,' '),email=$('#le').value.trim(),senha=$('#lp').value;er.textContent='';$('#lst').textContent='';
  if(nome.length<3||!/\s/.test(nome))return er.textContent='Informe o nome completo do(a) professor(a).';
  if(!email)return er.textContent='Informe o e-mail.';
  if(senha.length<6)return er.textContent='A senha precisa ter no mínimo 6 caracteres.';
  b.disabled=true;b.textContent='Criando conta…';
  try{const{data,error}=await db.auth.signUp({email,password:senha,options:{data:{full_name:nome}}});
    if(error){const m=error.message||String(error);er.textContent=/already|registered/i.test(m)?'Este e-mail já está cadastrado. Toque em "Entrar" para acessar.':/password/i.test(m)?'Senha inválida ou muito fraca. Use no mínimo 6 caracteres.':/valid email|invalid.*email/i.test(m)?'Esse e-mail não parece válido.':/rate limit|too many/i.test(m)?'Muitas tentativas. Aguarde alguns minutos e tente de novo.':/signups? .*disabled|not allowed/i.test(m)?'O cadastro de novos professores está desativado no momento.':/fetch|network/i.test(m)?'Sem ligação ao Supabase (internet ou bloqueio do site).':m}
    else if(data.session){$('#lp').value='';USER=data.session.user||data.user||USER;entrou();toast('Bem-vindo(a), '+nome.split(' ')[0]+'!')}
    else if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)er.textContent='Este e-mail já está cadastrado. Toque em "Entrar" para acessar.';
    else{$('#lp').value='';setLMode('in');$('#lst').textContent='Conta criada! Enviamos um e-mail de confirmação: verifique sua caixa de entrada (e o spam), confirme e depois entre.'}}
  catch(x){er.textContent='Erro: '+(x.message||x)}
  b.disabled=false;if(LMODE==='up')b.textContent='Criar conta e entrar'}
async function doLogin(e){e.preventDefault();if(LMODE==='up')return doSignUp();const b=$('#lb'),er=$('#lerr');b.disabled=true;b.textContent='Entrando…';er.textContent='';
  try{const{error}=await db.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
    if(error){const m=error.message||String(error);
      er.textContent=/invalid login/i.test(m)?'E-mail ou senha incorretos, ou esse utilizador ainda não existe no Supabase (Authentication → Users).':/not confirmed/i.test(m)?'E-mail ainda não confirmado: no Supabase, confirme o utilizador (Auto Confirm).':/fetch|network/i.test(m)?'Sem ligação ao Supabase (internet ou bloqueio do site).':m;health()}
    else{$('#lp').value='';USER=(await db.auth.getSession()).data.session?.user||USER;entrou()}}
  catch(x){er.textContent='Erro: '+(x.message||x);health()}
  b.disabled=false;b.textContent='Entrar'}
async function logout(){
  await flush();const n=Object.keys(pend()).length;
  if(n&&!confirm(n+' registro(s) ainda não foram enviados à nuvem. Continuam salvos neste aparelho e seguem quando você entrar de novo. Sair mesmo assim?'))return;
  await db.auth.signOut();location.reload()}

/* um único caminho de entrada (login ou sessão salva); evita repetir a sincronização a cada renovação de sessão */
function entrou(){if(!USER||USER.id===lastUid)return;lastUid=USER.id;LP='hfk_lp_'+USER.id;hideLogin();checaDono();adopt();syncAll();render(true)}
/* dados de outra conta neste aparelho nunca são enviados para a conta nova */
function checaDono(){const o=localStorage.getItem('hfk_owner'),tem=Object.keys(K).some(k=>raw(k).length);
  if(o&&o!==USER.id&&tem){if(confirm('Este aparelho guarda dados de outra conta. Para proteger os dados das crianças, eles serão removidos daqui antes de continuar. Baixar uma cópia agora?'))dl('happyfit-conta-anterior.json',JSON.stringify(Object.fromEntries(Object.keys(K).map(k=>[k,ld(k)])),null,2),'application/json');
    Object.values(K).forEach(k=>localStorage.removeItem(k));rmLP();[QK,'hfk_adraft','hfk_bdraft','hfk_ndraft','hfk_pdraft'].forEach(k=>localStorage.removeItem(k))}
  localStorage.setItem('hfk_owner',USER.id)}
async function boot(){
  if(!db){
    if(MODO_TESTE){addEventListener('online',paintSync);addEventListener('offline',paintSync);setInterval(paintSync,4000);return showLogin()}
    toast('Supabase indisponível.');return
  }
  const{data:{session}}=await db.auth.getSession();USER=session?session.user:null;
  db.auth.onAuthStateChange((ev,s)=>{USER=s?s.user:null;if(ev==='SIGNED_OUT')lastUid=null;
    if(ev==='SIGNED_IN'&&USER)entrou()});
  addEventListener('online',syncAll);addEventListener('online',paintSync);addEventListener('offline',paintSync);setInterval(paintSync,4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncAll()});
  setInterval(syncAll,6e4);
  if(!USER){if(MODO_TESTE)return modoLocal();return showLogin()}
  entrou()}

</script>
<script>/* Manual das Brincadeiras · Deyvison Ribeiro (consulta estática, fora do Supabase) */
const BRINC=[{"id":1,"n":1,"titulo":"Coelhinho Sai da Toca","ambiente":"Funcional","descricao":"As crianças serão distribuídas em grupos de três, sendo duas responsáveis por formar uma toca, enquanto a terceira representa o coelhinho, que ficará dentro dela. Ao comando do recreador, os coelhinhos deverão trocar de toca, enquanto o recreador também tentará ocupar uma das disponíveis. Quem ficar sem toca assume a próxima rodada como coelhinho ou recreador."},{"id":2,"n":2,"titulo":"O Mestre Mandou","ambiente":"Funcional","descricao":"Uma criança ou o recreador será o mestre e dará comandos que os participantes deverão executar somente quando forem precedidos pela expressão “O mestre mandou”. Os comandos podem envolver movimentos corporais, imitações de animais, desafios de equilíbrio ou pequenas tarefas motoras. Quem executar um comando sem a expressão deverá cumprir um desafio divertido."},{"id":3,"n":3,"titulo":"Caça ao Tesouro","ambiente":"Funcional","descricao":"O recreador esconderá pistas ou objetos em uma área delimitada, conduzindo as crianças por uma jornada de descobertas até encontrar o tesouro final. A atividade pode ser realizada individualmente ou em equipes, com desafios motores e enigmas simples entre as etapas."},{"id":4,"n":4,"titulo":"Batatinha Frita, 1, 2, 3","ambiente":"Funcional","descricao":"Uma criança será o guardião e ficará de costas para os demais, dizendo “Batatinha frita, 1, 2, 3!”. Enquanto isso, os participantes avançam em sua direção. Ao terminar a frase, o guardião se vira e todos deverão permanecer imóveis. Quem for visto se movimentando retorna ao ponto de partida. Vence quem alcançar primeiro o guardião."},{"id":5,"n":5,"titulo":"Vampirinho-Vampirão","ambiente":"Funcional","descricao":"Uma criança será escolhida como vampiro e ficará em uma extremidade da área, enquanto os demais participantes aguardam na extremidade oposta. Ao comando do vampiro, todos deverão atravessar o espaço tentando escapar de sua captura. Quem for pego poderá se transformar em ajudante do vampiro ou assumir seu lugar na próxima rodada."},{"id":6,"n":6,"titulo":"Corrida do Saco","ambiente":"Funcional","descricao":"Cada participante deverá entrar em um saco, segurando suas extremidades na altura da cintura. Ao sinal de largada, todos deverão avançar por meio de pequenos saltos até a linha de chegada. Vence quem completar o percurso primeiro, respeitando os limites da pista."},{"id":7,"n":7,"titulo":"Cabo de Guerra","ambiente":"Funcional","descricao":"Duas equipes ficarão posicionadas em lados opostos de uma corda, segurando suas extremidades. Ao sinal do recreador, ambas deverão puxar a corda tentando trazer a marca central para além de sua linha de vitória. A equipe que conseguir deslocar a marca para seu lado vence a rodada."},{"id":8,"n":8,"titulo":"Mão no Cone","ambiente":"Funcional","descricao":"Duas crianças ficarão frente a frente, com um cone posicionado entre elas. O recreador dará comandos relacionados às partes do corpo, como mão na cabeça, mão no joelho, mão no pé ou mão no ombro. Os participantes deverão executar os comandos rapidamente. Quando o recreador disser “CONE!”, ambos tentarão pegar o objeto primeiro."},{"id":9,"n":9,"titulo":"Estátua","ambiente":"Funcional","descricao":"As crianças deverão dançar livremente enquanto a música estiver tocando. Quando ela parar, todos deverão permanecer imóveis, formando uma estátua. Quem se movimentar poderá cumprir um desafio engraçado antes de retornar à brincadeira."},{"id":10,"n":10,"titulo":"Pular Corda e Cobrinha","ambiente":"Funcional","descricao":"Na modalidade tradicional, duas pessoas giram uma corda enquanto os participantes entram e saltam sobre ela, tentando acompanhar seu ritmo sem encostar. Na modalidade cobrinha, o recreador movimenta a corda rente ao chão, imitando uma serpente, e as crianças deverão saltar ou atravessar sem tocá-la."},{"id":11,"n":11,"titulo":"Bandeirinha","ambiente":"Funcional","descricao":"Duas equipes ocuparão lados opostos de uma área dividida ao meio, cada uma protegendo sua bandeira posicionada no próprio campo. O objetivo será invadir o território adversário, capturar a bandeira e levá-la até seu lado sem ser pego. Os participantes capturados poderão ficar em uma área de prisão, aguardando o resgate de um companheiro."},{"id":12,"n":12,"titulo":"Aquecimento com Circuito","ambiente":"Funcional","descricao":"O recreador organizará um percurso com cones, bambolês, cordas e outros materiais. As crianças deverão percorrê-lo realizando diferentes desafios, como saltar dentro das argolas, contornar obstáculos, equilibrar-se e correr até a linha final. O circuito poderá ser repetido com diferentes formas de deslocamento."},{"id":13,"n":13,"titulo":"Lona para Escorregar","ambiente":"Funcional","descricao":"Uma lona será posicionada em uma área plana e preparada com água para permitir o deslizamento. As crianças deverão deslizar sobre ela, individualmente ou em pequenos grupos, utilizando movimentos e posições variadas. A atividade deverá ocorrer em superfície adequada, sem obstáculos e com supervisão constante."},{"id":14,"n":14,"titulo":"Torta na Cara","ambiente":"Funcional","descricao":"Duas equipes participarão de um jogo de perguntas e respostas. Um participante de cada equipe ficará diante de um dispositivo com uma espuma macia ou elemento cenográfico. O recreador fará uma pergunta e quem responder corretamente poderá marcar ponto ou acionar a brincadeira sobre o adversário, conforme a regra estabelecida. A dinâmica deve evitar impactos no rosto e contato com olhos."},{"id":15,"n":15,"titulo":"Guerra de Balão","ambiente":"Funcional","descricao":"As crianças serão divididas em equipes e receberão balões com água. Ao sinal, deverão lançar os balões em direção à área adversária ou realizar desafios de transporte e arremesso em alvos. O objetivo poderá ser acertar alvos, preencher recipientes ou completar uma tarefa coletiva, evitando arremessos no rosto."},{"id":16,"n":16,"titulo":"Raio Laser","ambiente":"Funcional","descricao":"O recreador movimentará uma corda de um lado para o outro, simulando raios laser que atravessam uma área delimitada. As crianças deverão atravessar o espaço desviando da corda, seja abaixando-se, saltando ou passando por baixo dela. Quem for tocado deverá retornar ao início ou cumprir um desafio antes de tentar novamente."},{"id":17,"n":17,"titulo":"Jogo da Velha com Cones","ambiente":"Funcional","descricao":"Duas equipes receberão objetos de cores diferentes, que representarão seus símbolos. Um tabuleiro de jogo da velha será montado no chão com bambolês ou marcações. Ao sinal, um participante de cada equipe correrá até o tabuleiro e posicionará seu objeto em uma das casas. A equipe que formar primeiro uma sequência de três símbolos na horizontal, vertical ou diagonal vence."},{"id":18,"n":18,"titulo":"Acerte o Item (Objeto, Fruta ou Animal)","ambiente":"Funcional","descricao":"Uma criança escolherá secretamente um objeto, fruta, animal ou personagem. Os demais participantes deverão fazer perguntas que possam ser respondidas apenas com “sim” ou “não”, tentando descobrir o item escolhido. Quem acertar será responsável por escolher o próximo elemento."},{"id":19,"n":19,"titulo":"Cidade Dorme","ambiente":"Funcional","descricao":"Os participantes serão distribuídos em papéis secretos, como moradores, detetive e personagem responsável por eliminar jogadores ficticiamente. Durante a rodada, todos fecham os olhos quando o recreador anuncia que a cidade dormiu. Os personagens são chamados individualmente para realizar suas ações, sem revelar suas identidades. Quando a cidade acorda, todos discutem e tentam descobrir quem está causando os acontecimentos. A brincadeira segue até o grupo cumprir seu objetivo."},{"id":20,"n":20,"titulo":"Boca de Forno","ambiente":"Funcional","descricao":"As crianças formam uma roda e respondem ao recreador:\n“Boca de forno!”\n“Forno!”\n“Tirando bolo!”\n“Bolo!”\n“Fareis tudo que seu mestre mandar?”\n“Faremos todos!”\n“Se não fizer?”\n“Levaremos bolo!” Após a cantiga, o recreador dará um desafio que todos deverão cumprir, como buscar um objeto de determinada cor, imitar um animal, formar duplas ou realizar movimentos específicos."},{"id":21,"n":21,"titulo":"Gato-Mia","ambiente":"Funcional","descricao":"Uma criança será escolhida para procurar os demais participantes, permanecendo com os olhos fechados ou vendados em uma área segura. Enquanto isso, os outros se escondem. Quando o procurador encontrar alguém, deverá dizer “Gato mia!”. A criança encontrada deverá miar, e o procurador tentará descobrir quem é apenas pelo som. Se acertar, os papéis serão trocados."},{"id":22,"n":22,"titulo":"Pira-Cola","ambiente":"Funcional","descricao":"Uma criança será o pegador e deverá perseguir os demais participantes. Quando tocar em alguém, deverá dizer “Cola!”, fazendo com que essa pessoa fique parada no lugar. Os outros poderão libertá-la tocando nela e dizendo “Descola!”. O jogo continua até que todos sejam capturados ou até o recreador encerrar a rodada."},{"id":23,"n":23,"titulo":"Pira Alta","ambiente":"Funcional","descricao":"Uma criança será o pegador e tentará capturar os demais participantes. Para escapar, os fugitivos poderão subir em estruturas baixas e seguras ou ocupar espaços previamente definidos como áreas altas. Quem estiver protegido não poderá ser pego enquanto permanecer no local. O recreador deverá estabelecer previamente quais superfícies são permitidas."},{"id":24,"n":24,"titulo":"Mãe da Rua","ambiente":"Funcional","descricao":"Uma criança será a mãe da rua e ficará no centro de uma área delimitada. Os demais participantes ficarão em uma extremidade e deverão atravessar até o outro lado quando ela autorizar. Durante a travessia, a mãe da rua tentará capturar os participantes. Quem for pego poderá ajudá-la nas próximas rodadas. Vence quem conseguir atravessar sem ser capturado até o final."},{"id":25,"n":25,"titulo":"Chão é Lava","ambiente":"Funcional","descricao":"O recreador anunciará que o chão se transformou em lava e as crianças deverão se deslocar utilizando apenas os locais seguros previamente demarcados, como bambolês, tatames ou placas. Ao comando, poderão trocar de posição, atravessar o percurso ou encontrar novos refúgios sem tocar no chão proibido."},{"id":26,"n":26,"titulo":"Reloginho","ambiente":"Funcional","descricao":"Uma corda será amarrada a um cone ou segurada pelo recreador, que a movimentará circularmente próxima ao chão, como os ponteiros de um relógio. As crianças deverão atravessar o espaço ou resgatar um objeto sem serem tocadas pela corda. A cada rodada, a velocidade ou a direção poderá ser modificada."},{"id":27,"n":27,"titulo":"Mate o Rei","ambiente":"Funcional","descricao":"Uma variação estratégica da queimada tradicional, na qual duas equipes recebem papéis secretos inspirados nas peças do xadrez.\n• Rei: personagem principal; sua eliminação encerra a partida.\n• Rainha: possui uma regra especial de resistência, sendo eliminada apenas quando atingida nas regiões definidas previamente.\n• Cavalo: possui duas vidas, podendo continuar após o primeiro acerto.\n• Torre: atua como protetor do Rei, conforme as regras estabelecidas.\n• Bispo: ao ser atingido, elimina também o jogador responsável pelo arremesso, saindo ambos da rodada.\n• Peão: não possui habilidades especiais e é eliminado ao ser atingido. Os papéis serão distribuídos secretamente e cada equipe deverá proteger seu Rei enquanto tenta descobrir e eliminar o adversário. A partida exige estratégia, atenção e cooperação."},{"id":28,"n":28,"titulo":"Pega-Pega Caçador","ambiente":"Funcional","descricao":"O caçador conduzirá a brincadeira dando comandos que as crianças deverão imitar.\n• Tartaruga: abaixar-se e proteger o corpo com os braços.\n• Estrela-do-mar: abrir braços e pernas.\n• Tubarão: unir os pés e formar uma barbatana com os braços.\n• Estrela saltitante: realizar um polichinelo.\n• Mergulhador: agachar-se e colocar uma mão no nariz. Quando o caçador gritar “CAÇADOR!”, todos deverão correr até o refúgio demarcado, enquanto ele tenta capturar os participantes antes que alcancem a segurança."},{"id":29,"n":29,"titulo":"Ameba","ambiente":"Funcional","descricao":"Uma variação da queimada jogada individualmente, em que todos começam como jogadores ativos. Quem for atingido pela bola deverá se abaixar no local e se transformar em uma ameba. A ameba poderá retornar ao jogo se conseguir tocar em um participante que passar próximo ou acertar alguém com a bola, quando estiver ao seu alcance. Nesse caso, os jogadores trocam de condição. Os participantes que estiverem com a bola não poderão se deslocar enquanto a seguram. O jogo termina quando restar apenas um jogador em pé."},{"id":30,"n":30,"titulo":"Foguete-Estátua","ambiente":"Funcional","descricao":"O recreador dará comandos que as crianças deverão executar rapidamente:\n• Foguete: unir as mãos acima da cabeça e manter as pernas juntas.\n• Avião: abrir os braços e as pernas, imitando as asas.\n• Estátua: permanecer imóvel na pose mais criativa possível. Os comandos poderão ser alternados rapidamente, exigindo atenção, coordenação e controle corporal."},{"id":31,"n":31,"titulo":"Gelinho-Gelão","ambiente":"Funcional","descricao":"Uma criança será o pegador e tentará capturar os demais. Quando tocar em alguém, deverá escolher entre duas formas de congelamento:\n• Gelinho: o participante deverá agachar-se e poderá ser salvo por alguém que saltar sobre ele.\n• Gelão: o participante deverá ficar em pé com as pernas afastadas e poderá ser salvo por alguém que passar por baixo delas. A brincadeira continua até que todos sejam congelados ou até o encerramento da rodada."},{"id":32,"n":32,"titulo":"Sete Pecados","ambiente":"Funcional","descricao":"Uma criança ficará responsável pela bola e deverá lançá-la para cima enquanto fala o nome de um dos participantes. A criança chamada deverá tentar pegar a bola antes que ela toque o chão, enquanto os demais se afastam. Quando conseguir segurá-la, todos deverão parar imediatamente. O participante com a bola poderá dar até sete passos em direção a outro jogador e realizar um arremesso controlado abaixo da linha dos ombros. Quem for atingido assumirá a função de lançar a bola na próxima rodada."},{"id":33,"n":33,"titulo":"Corre-Cotia","ambiente":"Funcional","descricao":"As crianças formarão uma roda e permanecerão sentadas. Uma delas caminhará ao redor do círculo com um objeto na mão, enquanto todos cantam “Corre cotia, na casa da tia...”. Discretamente, deixará o objeto atrás de alguém. Ao perceber, a criança deverá levantar e correr atrás de quem deixou o objeto, tentando alcançá-la antes que ela ocupe seu lugar na roda."},{"id":34,"n":34,"titulo":"Elefante Colorido","ambiente":"Funcional","descricao":"O recreador será o elefante e dirá: “Elefante colorido!”. As crianças responderão: “Que cor?”. O recreador anunciará uma cor e todos deverão correr para tocar em algum objeto daquela tonalidade antes de serem alcançados pelo pegador."},{"id":35,"n":35,"titulo":"Amarelinha","ambiente":"Funcional","descricao":"Será desenhada uma sequência de casas numeradas no chão. Cada criança deverá lançar uma pedrinha ou marcador em uma das casas e percorrer o trajeto saltando em um pé ou com os dois pés, conforme a disposição das casas, sem pisar nas linhas ou na casa ocupada pelo objeto. Vence quem completar o percurso corretamente."},{"id":36,"n":36,"titulo":"Morto-Vivo","ambiente":"Funcional","descricao":"As crianças ficarão em pé diante do recreador. Ao comando “VIVO!”, deverão permanecer em pé; ao comando “MORTO!”, deverão agachar-se. O recreador alternará os comandos e poderá aumentar a velocidade ou utilizar palavras para confundir os participantes. Quem errar poderá cumprir um desafio e retornar ao jogo."},{"id":37,"n":37,"titulo":"Queimada Tradicional","ambiente":"Funcional","descricao":"Duas equipes ocuparão campos opostos, com uma bola macia. O objetivo será acertar os integrantes adversários abaixo da linha dos ombros, respeitando as regras estabelecidas. Quem for atingido poderá ir para uma área de reserva ou cumprir uma condição de retorno. Vence a equipe que conseguir eliminar todos os adversários ou alcançar a meta de pontos."},{"id":38,"n":38,"titulo":"Pega-Pega Corrente","ambiente":"Funcional","descricao":"Uma criança começa como pegador. Cada participante capturado deverá dar as mãos ao pegador, formando uma corrente que continuará perseguindo os demais. A corrente deverá se deslocar unida, tentando capturar todos os participantes. O último a ser pego poderá iniciar a próxima rodada."},{"id":39,"n":39,"titulo":"Passa-Anel","ambiente":"Funcional","descricao":"As crianças ficarão sentadas em roda, com as mãos unidas e ligeiramente abertas. Uma delas receberá um anel ou pequeno objeto e deverá fingir que o coloca nas mãos de todos, deixando-o discretamente com apenas um participante. Ao final, perguntará quem está com o anel. Quem acertar será o próximo distribuidor."},{"id":40,"n":40,"titulo":"Telefone sem Fio","ambiente":"Funcional","descricao":"As crianças ficarão organizadas em fila ou roda. O recreador sussurrará uma frase no ouvido do primeiro participante, que deverá repassá-la ao próximo, sem repetir. A mensagem seguirá até o último, que falará em voz alta o que recebeu. O grupo comparará a frase final com a original."},{"id":41,"n":41,"titulo":"Dança das Cadeiras","ambiente":"Funcional","descricao":"Serão organizadas cadeiras em círculo, sempre com uma cadeira a menos que o número de participantes. Enquanto a música tocar, todos deverão circular ao redor delas. Quando a música parar, cada criança tentará ocupar uma cadeira. Quem ficar sem lugar sairá da rodada, retirando-se também uma cadeira. A brincadeira continua até restar um vencedor."},{"id":42,"n":42,"titulo":"Elástico","ambiente":"Funcional","descricao":"Dois participantes ficarão posicionados segurando um elástico ao redor das pernas, enquanto outro deverá realizar uma sequência de saltos e movimentos previamente combinados. A altura do elástico poderá aumentar progressivamente, conforme a habilidade dos participantes. Quem completar a sequência poderá avançar de nível."},{"id":43,"n":43,"titulo":"Alerta Cor","ambiente":"Funcional","descricao":"Uma criança ficará com uma bola e as demais se distribuirão pela área. Ela lançará a bola para cima e gritará “ALERTA COR!”, anunciando uma cor. Os participantes deverão correr para tocar em algo daquela cor. A criança com a bola tentará acertar um jogador com um lançamento controlado antes que ele alcance o refúgio."},{"id":44,"n":44,"titulo":"Pique-Bandeira com Resgate","ambiente":"Funcional","descricao":"Duas equipes terão uma base e um objeto representando a bandeira. O objetivo será invadir o campo adversário, capturar a bandeira e retornar à própria base. Quem for pego no território rival deverá permanecer em uma área de prisão, podendo ser libertado por um companheiro que consiga tocá-lo."},{"id":45,"n":45,"titulo":"Pula-Carniça","ambiente":"Funcional","descricao":"Os participantes formarão uma fila, mantendo distância segura. O primeiro ficará inclinado, com as mãos apoiadas nos joelhos, enquanto o próximo deverá apoiar as mãos em suas costas e saltar por cima dele, afastando-se após aterrissar. A brincadeira prossegue com os demais participantes, respeitando a capacidade motora e a segurança de cada criança."},{"id":46,"n":46,"titulo":"Corrida do Ovo na Colher","ambiente":"Funcional","descricao":"Cada participante receberá uma colher com um ovo cozido ou uma bolinha leve. Ao sinal, deverá percorrer um trajeto equilibrando o objeto sem deixá-lo cair. Se cair, deverá recolocá-lo na colher e continuar. Vence quem completar o percurso primeiro."},{"id":47,"n":47,"titulo":"Adoleta","ambiente":"Funcional","descricao":"As crianças formarão uma roda e colocarão as mãos sobre as mãos dos colegas. Enquanto cantam a música tradicional da brincadeira, uma criança deverá bater levemente na mão do participante seguinte, seguindo o ritmo da cantiga. A dinâmica prossegue até o encerramento da sequência combinada."},{"id":48,"n":48,"titulo":"Seu Lobo","ambiente":"Funcional","descricao":"Uma criança será o lobo e ficará afastada do grupo. As demais perguntarão em coro: “Vamos passear no bosque enquanto seu lobo não vem?”. O lobo responderá com ações de preparação, como “Estou colocando a camisa”, “Estou calçando os sapatos”. Quando disser\n“Estou pronto!”, correrá atrás das crianças, que deverão fugir até o refúgio."},{"id":49,"n":49,"titulo":"Pega-Pega Congelante com Bola","ambiente":"Funcional","descricao":"O pegador utilizará uma bola macia para tentar tocar os demais participantes com lançamentos abaixo dos ombros. Quem for atingido ficará congelado no lugar, podendo ser libertado quando outro participante tocar nele. O objetivo será congelar todos antes que o tempo termine."},{"id":50,"n":50,"titulo":"Corrida de Três Pernas","ambiente":"Funcional","descricao":"As crianças formarão duplas e terão uma das pernas de cada participante unida por uma faixa macia. Ao sinal, deverão percorrer um trajeto coordenando os passos para chegar à linha final. A dupla deverá manter a união durante todo o percurso."},{"id":51,"n":1,"titulo":"Marco-Polo","ambiente":"Natação","descricao":"Uma criança será escolhida como procuradora e deverá localizar os demais participantes por meio das vozes e dos sons produzidos na água. Ela chamará “Marco!”, enquanto os outros responderão “Polo!”. O objetivo será encontrar e tocar um dos participantes dentro de uma área delimitada. A atividade deverá ser realizada sem venda nos olhos, em profundidade compatível com os participantes e com supervisão individual adequada."},{"id":52,"n":2,"titulo":"Salto Maluco","ambiente":"Natação","descricao":"As crianças deverão realizar saltos criativos a partir da borda ou de uma plataforma baixa autorizada, utilizando diferentes posições corporais, como estrela, foguete ou salto com braços abertos. A atividade deverá ser realizada somente em locais com profundidade apropriada, entrada controlada e autorização do professor."},{"id":53,"n":3,"titulo":"Caça-Letra ou Número","ambiente":"Natação","descricao":"Letras ou números flutuantes serão espalhados pela piscina. Ao comando do recreador, as crianças deverão localizar e recolher o elemento solicitado, levando-o até o ponto de entrega. A atividade poderá envolver identificação de letras, formação de palavras ou sequências numéricas."},{"id":54,"n":4,"titulo":"Enchendo o Pote","ambiente":"Natação","descricao":"As crianças serão divididas em equipes e receberão esponjas e recipientes vazios. Deverão mergulhar ou molhar as esponjas, transportando a água até os potes e espremendo-as dentro deles. Vence a equipe que atingir primeiro a marca estabelecida."},{"id":55,"n":5,"titulo":"Passa a Bola","ambiente":"Natação","descricao":"As crianças formarão filas dentro da piscina e deverão passar uma bola para o colega seguinte, alternando movimentos por cima da cabeça e entre as pernas, conforme o comando. A equipe que conseguir transportar a bola até o último participante primeiro vence a rodada."},{"id":56,"n":6,"titulo":"Travessia Maluca","ambiente":"Natação","descricao":"Os participantes deverão atravessar a piscina de diferentes maneiras, conforme os comandos do recreador, como caminhar lateralmente, deslocar-se com braços abertos, realizar pernadas segurando uma prancha ou nadar determinado estilo. A atividade poderá ser realizada individualmente ou em equipes."},{"id":57,"n":7,"titulo":"Passa no Túnel","ambiente":"Natação","descricao":"As crianças formarão uma fila ou túnel com as pernas afastadas, em uma profundidade segura. O último participante deverá deslocar-se até a frente passando por baixo dos braços ou entre as pernas dos colegas, conforme a adaptação. A dinâmica continua até que todos tenham participado."},{"id":58,"n":8,"titulo":"Atrás da Mesma Bola","ambiente":"Natação","descricao":"Uma bola será posicionada em um ponto previamente determinado da piscina. Ao sinal do recreador, os participantes deverão deslocar-se até ela e tentar alcançá-la primeiro. A brincadeira poderá ser adaptada para duplas ou equipes, com deslocamento por natação ou caminhada em água rasa."},{"id":59,"n":9,"titulo":"Estátua Aquática","ambiente":"Natação","descricao":"As crianças deverão movimentar-se livremente na água enquanto a música tocar. Quando o recreador anunciar “ESTÁTUA!”, todos deverão interromper os movimentos e permanecer na posição solicitada, como estrela, foguete ou equilíbrio com braços abertos."},{"id":60,"n":10,"titulo":"Procurando Nemo","ambiente":"Natação","descricao":"Bambolês ou objetos flutuantes serão distribuídos pela piscina, representando as casinhas dos participantes. Ao comando, as crianças deverão trocar de casinha, enquanto o recreador tenta ocupar uma delas. Quem ficar sem espaço deverá conduzir a próxima rodada."},{"id":61,"n":11,"titulo":"Corrida Submarina","ambiente":"Natação","descricao":"Os participantes deverão realizar deslocamentos subaquáticos curtos, com controle respiratório e sem competição de apneia. A atividade poderá ser proposta como busca de objetos em profundidade apropriada ou passagem por um arco submerso, respeitando o nível de habilidade de cada criança. Não deverão ser realizadas disputas para ver quem permanece mais tempo sem respirar."},{"id":62,"n":12,"titulo":"Polvo","ambiente":"Natação","descricao":"Uma criança será escolhida como polvo e ficará posicionada no centro da piscina. Os demais deverão atravessar de um lado ao outro sem serem tocados. Quem for capturado passará a integrar o polvo, ajudando a capturar os demais. A brincadeira termina quando todos forem alcançados."},{"id":63,"n":13,"titulo":"Cabo de Guerra Aquático","ambiente":"Natação","descricao":"Duas equipes ficarão posicionadas em lados opostos, segurando uma corda apropriada para uso aquático. Ao sinal, deverão puxar de maneira coordenada, tentando deslocar a marca central em direção ao seu campo. A atividade deverá ser realizada em água rasa, sem enrolar a corda no corpo e sem puxões bruscos."},{"id":64,"n":14,"titulo":"Vôlei Adaptado (Salve)","ambiente":"Natação","descricao":"Duas equipes ficarão posicionadas em lados opostos da piscina, separadas por uma linha ou rede imaginária. O objetivo será lançar a bola para o campo adversário e mantê-la em sua área de jogo. Se a bola permanecer no campo adversário por cinco segundos sem ser devolvida, a equipe que a lançou marcará um ponto. A dinâmica poderá ser adaptada para permitir uma ou mais tentativas de defesa."},{"id":65,"n":15,"titulo":"Caça ao Tesouro Aquático","ambiente":"Natação","descricao":"O recreador espalhará brinquedos flutuantes ou objetos apropriados em uma área delimitada. Ao sinal, as crianças deverão procurar e recolher os tesouros, transportando-os até um recipiente ou ponto de entrega. A atividade poderá ser realizada por cores, formas ou quantidade de objetos."},{"id":66,"n":16,"titulo":"Corrida das Esponjas","ambiente":"Natação","descricao":"Duas ou mais equipes receberão uma esponja e um recipiente vazio. O primeiro participante deverá molhar a esponja, transportá-la até o recipiente e espremê-la, retornando para entregar a esponja ao próximo colega. Vence a equipe que completar primeiro a quantidade de água estipulada."},{"id":67,"n":17,"titulo":"Pega-Pega Aquático","ambiente":"Natação","descricao":"Uma criança será o pegador e deverá perseguir os demais participantes dentro de uma área delimitada. Quem for tocado assumirá a função de pegador ou ficará congelado até ser libertado por outro colega. A atividade deverá ocorrer em profundidade adequada à capacidade de todos."},{"id":68,"n":18,"titulo":"Tubarão e Peixinhos","ambiente":"Natação","descricao":"Uma criança será o tubarão e ficará em uma extremidade da piscina, enquanto os demais serão peixinhos. Ao comando “Peixinhos, atravessem!”, todos deverão deslocar-se até o outro lado tentando evitar o tubarão. Quem for capturado poderá tornar-se ajudante do tubarão."},{"id":69,"n":19,"titulo":"Corrida de Pranchas","ambiente":"Natação","descricao":"Os participantes utilizarão pranchas para realizar deslocamentos por meio de pernadas, mantendo a posição corporal adequada. O percurso poderá ser feito individualmente ou em equipes, com a finalidade de alcançar uma marca determinada."},{"id":70,"n":20,"titulo":"Entrega do Tesouro","ambiente":"Natação","descricao":"Os participantes receberão um objeto flutuante que deverá ser transportado de um ponto a outro da piscina utilizando diferentes formas de deslocamento, como pernadas com prancha, nado ou caminhada em água rasa. O objetivo será entregar o objeto sem deixá-lo escapar."},{"id":71,"n":21,"titulo":"Bola ao Cesto Aquático","ambiente":"Natação","descricao":"Um cesto ou alvo flutuante será posicionado na piscina. As crianças deverão realizar lançamentos com bolas leves, tentando acertar o alvo. Cada acerto valerá um ponto, e a distância poderá ser ajustada conforme a habilidade dos participantes."},{"id":72,"n":22,"titulo":"Siga o Mestre Aquático","ambiente":"Natação","descricao":"O recreador realizará movimentos dentro da água, como bater pernas, abrir os braços, realizar deslocamentos laterais, girar ou fazer bolhas. As crianças deverão imitar os movimentos, acompanhando a sequência e o ritmo propostos."},{"id":73,"n":23,"titulo":"Corrida dos Animais Aquáticos","ambiente":"Natação","descricao":"O recreador anunciará um animal e as crianças deverão atravessar a piscina imitando seu movimento.\n• Sapo: pequenos saltos na água rasa.\n• Caranguejo: deslocamento lateral.\n• Peixe: pernadas com braços estendidos.\n• Golfinho: ondulação corporal adaptada ao nível de habilidade.\n• Polvo: deslocamento com movimentos amplos dos braços."},{"id":74,"n":24,"titulo":"Ilha dos Bambolês","ambiente":"Natação","descricao":"Bambolês flutuantes ou estruturas apropriadas serão distribuídos pela piscina, representando ilhas. As crianças deverão deslocar-se entre elas conforme os comandos do recreador. Quando ele anunciar “TEMPORAL!”, todos deverão procurar uma ilha disponível."},{"id":75,"n":25,"titulo":"Revezamento Aquático","ambiente":"Natação","descricao":"As crianças serão divididas em equipes e posicionadas em filas. O primeiro participante deverá atravessar um percurso previamente definido, tocar na borda ou entregar um objeto ao próximo colega. A equipe que concluir o revezamento primeiro vence."},{"id":76,"n":26,"titulo":"Bolhas de Sabão Aquáticas","ambiente":"Natação","descricao":"Em uma área rasa, o recreador convidará as crianças a realizar expirações na água, produzindo bolhas. Poderão ser propostos desafios como fazer bolhas grandes, pequenas ou contínuas, sempre respeitando o conforto e a capacidade respiratória de cada participante."},{"id":77,"n":27,"titulo":"Resgate dos Bichinhos","ambiente":"Natação","descricao":"Brinquedos flutuantes em formato de animais serão espalhados pela piscina. As crianças deverão resgatar os bichinhos e transportá-los até uma área segura, utilizando diferentes formas de deslocamento. A atividade poderá envolver identificação dos animais e separação por categorias."},{"id":78,"n":28,"titulo":"Corrida do Barquinho","ambiente":"Natação","descricao":"Cada criança receberá um barquinho flutuante. Ao sinal, deverá conduzi-lo até a linha de chegada utilizando sopros ou movimentos suaves da água com as mãos, sem empurrá-lo diretamente. Vence quem conseguir levar o barquinho primeiro ao destino."},{"id":79,"n":29,"titulo":"Caça às Cores","ambiente":"Natação","descricao":"Objetos de diferentes cores serão espalhados pela piscina. O recreador anunciará uma cor, e as crianças deverão encontrar um objeto correspondente e levá-lo até o ponto de coleta. Poderão ser criadas rodadas individuais ou cooperativas."},{"id":80,"n":30,"titulo":"Passa-Bola em Círculo","ambiente":"Natação","descricao":"As crianças formarão um círculo dentro da piscina e deverão passar uma bola de mão em mão, sem deixá-la escapar. Ao comando do recreador, a direção será invertida ou a bola deverá passar por cima da cabeça. O objetivo será manter a sequência pelo maior número de passes possível."}];</script>

/* ===== Escala de Erbaugh, versão brasileira (Wizer, 2020; Apêndice A, 47 itens): nível por tarefa. Sem normas ou pontos de corte ===== */
const ERB_DATA={"ent":[[1,"A criança senta ou fica em pé na borda da piscina. O examinador, em pé dentro da piscina, carrega a criança para dentro da água, segurando-a sob as axilas. Neste nível a criança não submerge a cabeça."],[2,"A criança inicia o salto da borda da piscina para a água em pé ou agachada. O examinador, em pé dentro da piscina, segura as mãos da criança durante a execução. Ao entrar na água a criança pode ou não submergir a cabeça."],[3,"A criança salta da borda da piscina para a água, em pé ou agachada, sem auxílio. O examinador, em pé dentro da piscina, segura a criança na água antes que a cabeça fique submersa ou após ela submergir a cabeça parcialmente."],[4,"A criança salta da borda da piscina para a água, em pé ou agachada, sem auxílio. O examinador, em pé dentro da piscina, segura a criança após ela submergir a cabeça totalmente ou depois que sua cabeça emerge na superfície."],[5,"A criança salta da borda da piscina para a água, em pé ou agachada, sem auxílio. Em seguida, ela nivela o corpo na posição horizontal em decúbito ventral. Finalmente, a criança propulsiona-se por uma distância de aproximadamente 1,5 m usando qualquer padrão. Neste nível, a maioria das crianças realiza um nado elementar."]],"ven":[[1,"O examinador sustenta a criança em decúbito ventral, segurando-a sob as axilas, deixando seus braços e mãos livres. A criança não executa movimentos de braços, mesmo quando solicitada a realizá-los. De forma voluntária, ela executa movimentos de pernas aleatórios e inconsistentes. Sua posição corporal é quase vertical (75°) ou vertical (90º). A cabeça permanece fora da água."],[2,"O examinador sustenta a criança em decúbito ventral, segurando-a sob as axilas. Os ombros da criança ficam flexionados, com membros superiores no prolongamento do corpo, à frente da cabeça. Neste nível, a criança pode tentar remar com os braços quando solicitada; no entanto, não há propulsão. Os movimentos de pernas são uma ação de pedalada cadenciada, com pouco efeito propulsivo. A posição corporal é inferior a 60°. A cabeça permanece fora da água."],[3,"A criança, usando um aquatubo sob as axilas, propulsiona-se por uma distância de aproximadamente 1,5 m. O examinador pode auxiliar a criança a iniciar a tarefa. Os movimentos de braços são remadas subaquáticas sem propulsão e os movimentos de pernas são uma ação de pedalada com pouca propulsão. A posição corporal é quase vertical (75º). A cabeça permanece fora da água."],[4,"A criança, usando um aquatubo sob as axilas, propulsiona-se por uma distância de aproximadamente 3m. O examinador não auxilia. Os movimentos de braços são remadas subaquáticas com pouca ou nenhuma propulsão. Os movimentos de pernas são uma ação de pedalada que geram sustentação e propulsão moderadas. A posição corporal é inferior a 60°. Neste nível a criança pode ou não submergir a cabeça."],[5,"A criança, sem qualquer equipamento de flutuação, propulsiona-se por uma distância de aproximadamente 1,5 m. Ela usa um nado elementar. O examinador não auxilia. Os movimentos de braços são remadas subaquáticas com pouca propulsão. Os movimentos de pernas são uma ação de pedalada com pouca sustentação e propulsão. A posição corporal é de aproximadamente 45º. Neste nível a criança pode ou não submergir a cabeça."],[6,"A criança propulsiona-se sem equipamento por uma distância de aproximadamente 3 m. Ela usa um nado elementar. O examinador não auxilia. Os movimentos de braços são remadas subaquáticas com propulsão moderada. Os movimentos de pernas são uma ação de pedalada com propulsão moderada. Um batimento de pernas rudimentar (adejamento) começa a surgir neste nível. A posição corporal é menor que 45º (aproximadamente 20 a 40º). A cabeça fica submersa."],[7,"A criança propulsiona-se sem equipamento por uma distância de aproximadamente 3 m. Este é o início da transição de um nado elementar para um padrão de crawl. O examinador não auxilia. Os movimentos de braços são remadas subaquáticas com considerável propulsão. Os movimentos de pernas são pedaladas e/ou batimentos de pernas rudimentares com propulsão. A posição corporal é menor que 45º (aproximadamente 20 a 40º). A cabeça submerge de forma intermitente. A criança levanta a cabeça (queixo) fora da água para expirar/inspirar."],[8,"A criança propulsiona-se sem equipamento por uma distância de aproximadamente 3 m. O padrão rudimentar de crawl continua a aparecer. O examinador não auxilia. Os movimentos de braços são um padrão de braçadas com recuperação aérea aleatória. A criança ocasionalmente recupera um braço fora da água. O padrão geralmente não é cadenciado. O padrão de movimento de pernas é um batimento rudimentar e/ou razoavelmente eficiente. A posição corporal é menor que 45º (aproximadamente 20 a 40º). A cabeça submerge de forma intermitente. A criança levanta a cabeça (queixo) fora da água para expirar/inspirar."],[9,"A criança propulsiona-se sem equipamento por uma distância de aproximadamente 6 m. O padrão de crawl continua a aparecer. Executa técnica de respiração, e coordenação cadenciada dos braços e da respiração é desenvolvida. O examinador não auxilia. Os braços são recuperados fora da água de maneira razoavelmente cadenciada. O padrão de movimento de pernas é um batimento razoavelmente eficiente. A posição corporal é menor que 20°. A criança expira durante a imersão da cabeça e inspira levantando-a (queixo) fora da água."],[10,"A criança propulsiona-se sem equipamento por uma distância de aproximadamente 6 m. Surge um padrão de crawl razoavelmente maduro. Os movimentos dos braços, pernas e cabeça agora são coordenados. O examinador não auxilia. Os braços são recuperados fora da água de maneira cadenciada. O padrão de batimento de pernas é eficiente. A posição corporal é quase horizontal (menor que 10º). A criança expira durante a imersão da cabeça e inspira rotando (girando) o pescoço lateralmente. A técnica de respiração por rotação está em desenvolvimento."]],"dor":[[1,"O examinador sustenta a criança em decúbito dorsal, segurando-a sob as axilas. O tronco e os membros da criança geralmente estão rígidos e tensos. Em alguns casos, ela assume posição sentada ou quase sentada. A criança segura-se ao examinador. As pernas da criança geralmente ficam estendidas e tensas ao ser colocada nessa posição. Ela executará várias pernadas, a intervalos irregulares se lhe forem solicitadas. O tronco fica quase na vertical, e quadril pode ser flexionado (posição do peito em direção às coxas). A cabeça permanece fora da água."],[2,"O examinador sustenta a criança em decúbito dorsal, segurando-a sob as axilas e amparando a cabeça no ombro do avaliador. A criança está mais relaxada do que no nível anterior. Ela segura-se ao examinador com um braço só, de maneira relaxada ou não se segura. Não há movimentos propulsivos de braços. Os movimentos de pernas são voluntários e contínuos. Eles não produzem sustentação ou propulsão. O corpo da criança, incluindo o tronco e as pernas, fica estendido e quase na horizontal. A cabeça fica geralmente fora da água. Neste nível, a criança pode manter a parte posterior da cabeça submersa, mas as orelhas ficam acima da água."],[3,"O examinador segura somente a cabeça da criança, que está em decúbito dorsal. Seus braços e mãos flutuam na água, livres do examinador. Não há movimentos propulsivos de braços. Os movimentos de pernas são voluntários e contínuos. Eles produzem pouca sustentação. A posição corporal é quase horizontal, semelhante à do nível anterior. A cabeça fica submersa até as orelhas, e a criança olha para o teto."],[4,"A criança, usando um aquatubo sob as axilas, propulsiona-se por uma distância de aproximadamente 1,5 m. O examinador pode auxiliar a criança em alguns momentos durante a tarefa. Não realiza movimento propulsivo de braços. Os movimentos de pernas são batimentos rudimentares cadenciados. A pernada produz pouca sustentação e propulsão. A posição corporal é de aproximadamente 45º. À medida que a criança percorre a distância de aproximadamente 1,5 m, sua posição corporal vai se verticalizando, podendo chegar a uma posição sentada ao final do percurso. A criança inicia a tarefa com a cabeça submersa até as orelhas."],[5,"A criança, usando um aquatubo sob as axilas, propulsiona-se por uma distância de aproximadamente 3 m. O examinador pode auxiliar a criança em alguns momentos durante a tarefa. As características do nado são semelhantes às do nível anterior. No entanto, a criança pode ou não realizar movimentos de braços do tipo nadadeiras (para cima e para baixo) ou palmateios. Os movimentos geram pouca propulsão. Os movimentos de pernas são batimentos rudimentares que produzem sustentação e propulsão moderadas. A posição corporal é de aproximadamente 45º. À medida que a criança percorre a distância de aproximadamente 3 m, sua posição corporal pode ir se verticalizando, podendo chegar a uma posição sentada ao final do percurso. A criança inicia a tarefa com a cabeça submersa até as orelhas."],[6,"A criança, usando um aquatubo sob as axilas, propulsiona-se por uma distância de aproximadamente 3 m. O examinador pode auxiliar a criança a iniciar a tarefa, mas não auxilia a criança a manter a posição ao longo do percurso. Pode ou não realizar movimentos de braços do tipo nadadeiras (para cima e para baixo) ou palmateios. Os movimentos geram pouca propulsão. Os movimentos de pernas são batimentos rudimentares que produzem sustentação e propulsão. A posição corporal é quase horizontal e a cabeça fica submersa até as orelhas. A posição corporal se mantém até o final do percurso."],[7,"A criança propulsiona-se sem equipamento por uma distância de aproximadamente 1,5 m. O examinador pode auxiliar a criança a iniciar a tarefa. Pode ou não realizar movimentos de braços, de nadadeira ou palmateio. Os movimentos geram pouca propulsão. Os movimentos de pernas são batimentos rudimentares que produzem propulsão. A posição corporal é de 45º quando a criança começa a nadar. O quadril cai para uma posição vertical durante a tarefa. A cabeça fica submersa até as orelhas."],[8,"A criança propulsiona-se sem equipamento por uma distância de aproximadamente 3 m. O examinador pode auxiliar a criança a iniciar a tarefa. Pode ou não realizar movimentos de braços, de nadadeira ou palmateio. Os movimentos geram pouca ou moderada propulsão. A ação de pernas são batimentos rudimentares que produzem propulsão. A posição corporal é de aproximadamente 45º quando a criança começa a nadar. O quadril pode cair para uma posição vertical durante a tarefa. A cabeça fica submersa até as orelhas."],[9,"A criança propulsiona-se sem equipamento por uma distância de aproximadamente 3 m. O examinador não auxilia. Os movimentos de braços são os de nadadeira ou palmateio. Neste nível, a amplitude da ação dos braços é maior do que a do nível anterior. Ou seja, neste nível, as mãos realizam um movimento cuja trajetória se inicia à altura dos ombros. Os braços agora produzem sustentação e propulsão consideráveis. Os movimentos de pernas são batimentos que produzem considerável propulsão. A posição corporal é quase horizontal (menor que 10º). A criança também mantém uma posição horizontal durante a tarefa. A cabeça fica submersa até as orelhas."],[10,"A criança propulsiona-se sem equipamento por uma distância de aproximadamente 6 m. O examinador não auxilia. A ação de braços é um padrão de braçada com recuperação aérea razoavelmente eficiente. O padrão de movimento de pernas é um batimento eficiente. A posição corporal é quase horizontal (menor que 10º). A cabeça fica submersa até as orelhas."]],"per":[[1,"O examinador sustenta a criança em decúbito ventral, segurando-a sob as axilas. A criança segura os antebraços do examinador. Os movimentos de pernas são limitados; também são aleatórios e/ou inconsistentes. A posição corporal é quase vertical (aproximadamente 75°). A cabeça permanece fora da água."],[2,"O examinador sustenta a criança em decúbito ventral, segurando-a sob as axilas. A criança pode ou não segurar os antebraços do examinador. Os movimentos de pernas são razoavelmente cadenciados e consistentes; também são mais vigorosos que a ação de pernas do nível anterior. A criança executa pedaladas para manter a estabilidade do corpo na água. A posição corporal é inferior a 60º. A cabeça permanece fora da água."],[3,"A criança propulsiona-se com a ajuda de um aquatubo posicionado de modo a fornecer apoio aos membros superiores, por uma distância de aproximadamente 1,5 m. Os movimentos de pernas são pedaladas que produzem pouca propulsão. A posição corporal é quase vertical (aproximadamente 75°). A cabeça permanece fora da água."],[4,"A criança propulsiona-se com a ajuda de um aquatubo posicionado de modo a fornecer apoio aos membros superiores, por uma distância de aproximadamente 3 m. Os movimentos de pernas são pedaladas com pouca ou moderada propulsão. A posição corporal é inferior a 60º. A posição corporal pode ir se verticalizando à medida que a criança percorre a distância de 3 m. Neste nível a criança pode ou não submergir a cabeça."],[5,"A criança propulsiona-se com a prancha por uma distância de aproximadamente 1,5 m. A criança segura a borda superior ou bordas laterais da prancha com as mãos, conduzindo-a. Em alguns casos, parte do tronco da criança pode ficar apoiado sobre a prancha. Os movimentos de pernas são uma ação de pedalada com pouca sustentação e propulsão. A posição corporal varia em torno dos 45º. Neste nível a criança pode ou não submergir a cabeça."],[6,"A criança propulsiona-se com a prancha por uma distância de aproximadamente 3 m. A criança segura a borda inferior ou bordas laterais da prancha com as mãos, conduzindo-a. Os movimentos de pernas são uma ação de pedalada com sustentação e propulsão moderadas. A posição corporal é menor que 45º. O rosto fica submerso."],[7,"A criança propulsiona-se com a prancha por uma distância de aproximadamente 3 m. A criança segura a borda inferior ou bordas laterais da prancha com as mãos, conduzindo-a. A ação de pernas é um batimento rudimentar e pedaladas com propulsão considerável. A posição corporal é menor que 45º (aproximadamente 20 a 40°). O rosto fica submerso."],[8,"A criança propulsiona-se com a prancha por uma distância de aproximadamente 6 m. A criança segura a borda inferior ou bordas laterais da prancha com as mãos. Os cotovelos ficam estendidos. O movimento de pernas é um batimento rudimentar com considerável propulsão. A posição corporal é quase horizontal (menor que 10º). O rosto fica submerso."],[9,"A criança propulsiona-se com a prancha por uma distância de aproximadamente 6 m. A criança segura a borda inferior ou bordas laterais da prancha com as mãos. Os cotovelos ficam estendidos. A ação de pernas é um batimento razoavelmente eficiente ou eficiente. A posição corporal é quase horizontal (menor que 10º). O rosto fica submerso."]],"mer":[[1,"A criança inicia o mergulho de uma posição sentada na borda da piscina. Ela mergulha caindo de barriga/cabeça à frente em direção ao examinador. O examinador pode auxiliar a criança na preparação para o mergulho."],[2,"A criança inicia o mergulho de uma posição ajoelhada ou agachada na borda da piscina. Ela mergulha caindo de barriga à frente em direção ao examinador. O examinador pode auxiliar a criança na preparação para o mergulho."],[3,"A criança inicia o mergulho de uma posição em pé na borda da piscina. Ela mergulha caindo de barriga à frente, sem empurrar a borda, em direção ao examinador. O examinador pode auxiliar a criança na preparação para o mergulho."],[4,"A criança inicia o mergulho de uma posição em pé na borda da piscina. Ela mergulha caindo de barriga à frente, empurrando a borda, em direção ao examinador. O examinador pode auxiliar a criança na preparação para o mergulho."],[5,"A criança inicia o mergulho de uma posição ajoelhada ou agachada na borda da piscina. Ela mergulha caindo de cabeça à frente em direção ao examinador. O examinador pode auxiliar a criança na preparação para o mergulho."],[6,"A criança inicia o mergulho de uma posição em pé na borda da piscina. Ela mergulha caindo de cabeça à frente. Ao iniciar o salto, a criança pode ou não empurrar a borda. O examinador pode auxiliar a criança na preparação para o mergulho."]],"bus":[[1,"A criança, em pé na piscina com a água na altura entre o quadril e o peito, submerge parcialmente o rosto a fim de pegar um objeto indicado pelo examinador. A criança executa a tarefa com auxílio."],[2,"A criança, em pé na piscina com a água na altura entre o quadril e o peito, submerge parcialmente o rosto a fim de pegar um objeto indicado pelo examinador. A criança executa a tarefa sem auxílio."],[3,"A criança, em pé na piscina com a água na altura entre o quadril e o peito, submerge totalmente o rosto a fim de pegar um objeto indicado pelo examinador. A criança executa a tarefa com auxílio."],[4,"A criança, em pé na piscina com a água na altura entre o quadril e o peito, submerge totalmente o rosto a fim de pegar um objeto indicado pelo examinador. A criança executa a tarefa sem auxílio."],[5,"A criança, em pé na piscina com a água na altura entre o quadril e o peito, submerge totalmente o rosto, retirando os pés da base de apoio e adotando posição em decúbito ventral na água, a fim de pegar um objeto indicado pelo examinador. A criança executa a tarefa com auxílio."],[6,"A criança, em pé na piscina com a água na altura entre o quadril e o peito, submerge totalmente o rosto, retirando os pés da base de apoio e adotando posição em decúbito ventral na água, a fim de pegar um objeto indicado pelo examinador. A criança executa a tarefa sem auxílio."],[7,"A criança propulsiona-se por uma distância de, no mínimo, 50 cm na posição de decúbito ventral e então pega um objeto indicado pelo examinador antes de ficar em pé na base de apoio com a água na altura entre o quadril e o peito. A criança executa a tarefa sem auxílio."]]};

function row(g,i,desc=''){const[it,op]=SG[g],name=it[i],v=A[g][name],pv=PV&&PV[g]&&PV[g][name];
  const cols='grid-cols-5';
  const nl=v?ESC.find(n=>n[0]===v):null;
  return `<div class="it" id="r-${g}-${i}"><div class="flex justify-between gap-2"><p class="font-extrabold text-sm leading-tight">${esc(name)}</p>${pv?`<span class="hint !not-italic font-bold shrink-0">antes: ${esc(g==='dev'||g==='soc'?SHORT[g][optIdx(g,pv)]:pv)}</span>`:''}</div>${desc?`<p class="hint">${esc(desc)}</p>`:''}
  <div class="flex flex-wrap gap-1.5 mt-2">${op.map((o,j)=>`<button class="sc flex-1 !w-auto min-w-[3.25rem] ${v===o[0]?'on '+o[2]:''}" onclick="setV('${g}',${i},${j})">${esc(o[1])}${o[3]?`<span class="block text-[9px] font-semibold opacity-80 mt-0.5">${esc(o[3])}</span>`:''}</button>`).join('')}</div>
  ${nl?`<p class="hint mt-1">${nl[0]} · ${nl[4]}</p>`:''}</div>`}
function setV(g,i,j){const name=SG[g][0][i],v=SG[g][1][j][0];if(A[g][name]===v)delete A[g][name];else A[g][name]=v;dA();
  const e=$(`#r-${g}-${i}`);if(e)e.outerHTML=row(g,i);updCount()}
function setF(k,v){A[k]=A[k]===v?'':v;dA();render(true)}
function hasAssessmentDraft(){
  return !!(
    A.id||
    Object.keys(A.fis||{}).length||Object.keys(A.aqu||{}).length||Object.keys(A.sce||{}).length||
    A.conc||A.prim||A.sec||A.estr||A.prox||
    A.data!==today()
  )
}
function pickAv(id){
  const next=String(id||''),old=String(A.aluno||'');
  if(next===old){dA();render(true);return}
  if(old&&hasAssessmentDraft()){
    if(!confirm('Há uma avaliação em andamento. Descartar o preenchimento e mudar de aluno?'))return render(true)
  }
  A=newA();A.aluno=next;
  const s=alu(next),l=evalsOf(next),last=l[l.length-1];
  if(next){
    A.tipo=l.length?(last?.tipo==='Anual'?'Anual':(last?.tipo==='Semestral'?'Anual':'Trimestral')):'Inicial';
    A.freq=last?.freq||'';
    A.data=today();
    A.responsavel=responsavel();
  }
  dA();render(true)
}
function addM(m){const d=new Date((A.data||today())+'T12:00');d.setMonth(d.getMonth()+m);A.prox=d.toISOString().slice(0,10);dA();render(true)}
function openSec(n){AO=AO===n?0:n;render(true);if(AO)$('#sec-'+n).scrollIntoView({behavior:'smooth',block:'start'})}
const txt=(k,ph,rows=3)=>`<textarea rows="${rows}" class="in" placeholder="${esc(ph)}" oninput="A.${k}=this.value;dA();updCount()">${esc(A[k])}</textarea>`;

function secBody(n){const s=alu(A.aluno);
  if(n===1){const al=ld('s').sort((x,y)=>x.nome.localeCompare(y.nome));
    return `<p class="lb !mt-0">Aluno</p><select class="in" onchange="pickAv(this.value)"><option value="">Selecione…</option>${al.map(x=>`<option value="${x.id}" ${A.aluno==x.id?'selected':''}>${esc(x.nome)} · ${idTxt(x)}</option>`).join('')}${A.aluno&&!s?`<option selected value="${esc(A.aluno)}">${esc(A.alunoNome||'(aluno removido)')}</option>`:''}</select>
    <button class="text-sm font-extrabold mt-2" style="color:var(--b)" onclick="modal('',id=>pickAv(id))">+ Cadastrar novo aluno rapidamente</button>
    ${s?`<p class="text-sm font-bold mt-2" style="color:var(--c)">Idade na avaliação: ${idadeEm(s,A.data||today())}</p>`:''}
    ${PV?`<p class="hint">Última avaliação: ${esc(PV.tipo)} em ${dBR(PV.data)}. As marcações anteriores aparecem como “antes”.</p>`:''}
    ${s&&s.obs?`<div class="card !bg-amber-50 dark:!bg-amber-950 mt-3 !border-amber-200 dark:!border-amber-800 !mb-0"><p class="hint !not-italic">Atenção: ${esc(s.obs)}</p></div>`:''}
    <p class="lb">Tipo de avaliação</p><div class="flex flex-wrap gap-1.5">${ATIPOS.map(t=>`<button class="sc flex-1 !w-auto min-w-[4.5rem] ${A.tipo===t?'on':''}" onclick="setF('tipo','${t}')">${t}</button>`).join('')}</div>
    <p class="lb">Frequência semanal do aluno</p><div class="flex flex-wrap gap-1.5">${FREQS.map(t=>`<button class="sc flex-1 !w-auto min-w-[3rem] ${A.freq===t?'on g':''}" onclick="setF('freq','${t}')">${t}<span class="block text-[9px] font-semibold opacity-80">semana</span></button>`).join('')}</div>
    <p class="lb">Data da avaliação</p><input type="date" class="in" value="${esc(A.data)}" onchange="A.data=this.value;dA();render(true)">
    <p class="hint mt-3">Responsável: <strong>${esc(responsavel())}</strong> (definido pela conta logada)</p>`}
  if(n<5){const g=['','','fis','aqu','sce'][n],e=EIX[g];let i=0;
    return `<p class="hint mb-2">Use o nível que melhor representa o desempenho observado naquela situação. NR 0 · RA 1 · RD 2 · RAu 3. AD indica que a tarefa precisou de adaptação pedagógica e não entra no cálculo da média. A escala é descritiva e serve para acompanhar mudanças ao longo do tempo; não é um teste diagnóstico padronizado.</p>${e[2].map(x=>`<p class="lb !mt-3" style="color:var(--${e[1]})">${x[0]}</p>${x[1].map(()=>row(g,i++)).join('')}`).join('')}<p class="lb">Observações do eixo</p>${txt('o_'+g,'Opcional.')}`}
  return PDI.map((p,j)=>`<p class="lb ${j?'':'!mt-0'}">${p[1]}</p><p class="hint mb-1">${p[2]}</p>${txt(p[0],p[3])}`).join('')+
    `<p class="lb">Data da próxima avaliação prevista</p><input type="date" class="in" value="${esc(A.prox)}" onchange="A.prox=this.value;dA();updCount()">
    <div class="grid grid-cols-3 gap-1.5 mt-2">${[[3,'+3 meses'],[6,'+6 meses'],[12,'+1 ano']].map(m=>`<button class="sc" onclick="addM(${m[0]})">${m[1]}</button>`).join('')}</div>`}

function pcAreaCard(){
  const all=ld('p').slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))),r=pcRascunho();
  return `<div class="card !p-4 mb-4" style="border-left:5px solid var(--c)"><p class="text-base font-extrabold">Avaliação com protocolo de aplicação</p><p class="hint mt-1">Escolha aluno, modalidade e protocolo; consulte faixa etária e instruções disponíveis; registre cada tarefa e acompanhe o histórico. O catálogo distingue instrumentos padronizados (com disponibilidade/licença a verificar) dos protocolos autorais HAPPYFIT, que estão em desenvolvimento e não são validados.</p><div class="grid grid-cols-1 gap-2 mt-3"><button class="btn !py-3" onclick="pcAbrir('${AS||''}')">+ Nova avaliação por protocolo</button>${r?`<button class="btn ghost !py-3" onclick="pcRetomar()">Retomar avaliação em andamento · ${esc(r.abrev||'protocolo')}</button>`:''}</div>${all.length?`<p class="lb">Aplicações recentes</p><div class="space-y-2">${all.slice(0,5).map(x=>`<button class="w-full text-left rounded-2xl border p-3" style="border-color:var(--bd2);background:var(--soft)" onclick="pcVer('${x.id}')"><span class="block text-sm font-extrabold">${esc(x.abrev||x.nomeProt||'Protocolo')} · ${esc(x.alunoNome||nomeDe(x))}</span><span class="hint !mt-0.5">${fmt(x.data)} · ${esc(x.modo==='parcial'?'aplicação parcial':'aplicação completa')} · ${esc(x.status==='concluida'?'concluída':'rascunho')}</span></button>`).join('')}</div>`:'<p class="hint mt-3">Nenhuma aplicação por protocolo registrada ainda.</p>'}</div>`
}
function vAval(){PV=prevOf(A);
  return `${head('Avaliar','Acesse primeiro a avaliação por protocolo para conduzir a aplicação e registrar cada tarefa. O acompanhamento descritivo abaixo permanece disponível como recurso complementar.')}
  ${pcAreaCard()}
  ${head(A.id?'Editar acompanhamento descritivo':'Acompanhamento descritivo','Registro pedagógico de observações em escala 0–3. Este formulário não é a aplicação de um instrumento padronizado e não gera classificação diagnóstica.')}
  ${A.id?`<div class="card !bg-blue-50 dark:!bg-blue-950 !border-blue-200 dark:!border-blue-800 text-sm font-bold">Editando a avaliação ${esc(A.tipo)} de ${esc(nomeDe(A))}.</div>`:''}
  <div class="card !p-3 flex items-center gap-3"><div class="flex-1 h-2.5 rounded-full bg-blue-100 dark:bg-slate-700 overflow-hidden"><div id="aprog" class="h-full rounded-full transition-all" style="background:linear-gradient(90deg,var(--c),var(--g));width:${pct()}%"></div></div><span id="apct" class="text-xs font-extrabold w-9 text-right">${pct()}%</span></div>
  ${SECS.map(([n,t,c])=>{const k=cnt(n);return `<div class="acc" id="sec-${n}"><button onclick="openSec(${n})"><span class="num" style="background:var(--${c})">${n}</span><span class="flex-1 font-extrabold leading-tight">${t}</span><span id="c-${n}" class="text-xs font-extrabold text-slate-400" style="${cdone(n)?'color:var(--g)':''}">${k}</span><span class="text-sm">${AO===n?'▲':'▼'}</span></button>${AO===n?`<div class="px-4 pb-4">${secBody(n)}</div>`:''}</div>`}).join('')}
  <div class="fixed bottom-[60px] inset-x-0 max-w-md mx-auto px-5 pb-3 pt-6 flex gap-2 z-20" style="background:linear-gradient(0deg,var(--bg) 70%,transparent);margin-bottom:env(safe-area-inset-bottom)">
  <button class="btn ghost !w-1/3" onclick="newAv()">${A.id?'Cancelar':'Nova'}</button><button class="btn g" onclick="saveA()">${A.id?'Salvar alterações':'Salvar avaliação'}</button></div>`}
function newAv(){if(confirm(A.id?'Descartar as alterações desta avaliação?':'Descartar o preenchimento atual e começar uma nova avaliação?')){A=newA();AO=1;localStorage.removeItem('hfk_adraft');render()}}
function saveA(){const miss=!A.aluno?'Selecione o aluno':!A.tipo?'Escolha o tipo de avaliação':!A.data?'Informe a data da avaliação':'';
  if(miss){toast(miss);AO=1;render(true);$('#sec-1').scrollIntoView({behavior:'smooth'});return}
  const a=ld('a'),now=new Date().toISOString(),o={...normA(A),alunoNome:nomeDe(A),atualizado:now};
  const i=o.id?a.findIndex(x=>x.id==o.id):-1;
  if(i>-1)a[i]=o;else{o.id=String(Date.now());o.criado=now;a.unshift(o)}
  sv('a',a);localStorage.removeItem('hfk_adraft');A=newA();AO=1;
  toast('Avaliação salva no histórico do aluno.');AS=o.aluno;AT='av';tab='alu';render()}
function editA(id){const o=ld('a').find(x=>x.id==id);if(!o)return;
  if(A.aluno&&!A.id&&sc(2)[0]+sc(3)[0]+sc(4)[0]>0&&!confirm('Há uma avaliação em andamento. Substituir pelo modo de edição?'))return;
  A=normA(o);AO=2;tab='aval';dA();render()}
function delA(id){if(confirm('Excluir esta avaliação do histórico do aluno?')){sv('a',ld('a').filter(x=>x.id!=id));toast('Avaliação excluída.');render(true)}}
function startAv(id){if(hasAssessmentDraft()){if(!confirm('Há uma avaliação em andamento. Descartá-la e começar uma nova para este aluno?'))return;A=newA();localStorage.removeItem('hfk_adraft')}
  tab='aval';AO=1;pickAv(id)}

/* ----- histórico comparativo (aba Alunos) ----- */
const colr=c=>`var(--${c||'b'})`;
function bd(g,v){if(!v)return'<span class="text-slate-300 font-bold">—</span>';const j=optIdx(g,v);if(j<0)return esc(v);const o=SG[g][1][j];
  return `<span class="bd" style="background:${colr(o[2])}">${esc(SHORT[g]?SHORT[g][j]:v)}</span>`}
const media=(a,gs)=>{const v=gs.flatMap(g=>Object.values(a[g]||{}).map(x=>optIdx(g,x)).filter(x=>x>=0&&x<4));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const f1=x=>x==null?'—':x.toFixed(1).replace('.',',');
function avCard(a,nome){const n=k=>Object.keys(a[k]||{}).length;
  return `<div class="card"><div class="flex justify-between gap-2"><p class="font-extrabold text-lg leading-tight">${nome?esc(nomeDe(a))+' · ':''}${esc(a.tipo)}</p><span class="hint !not-italic font-bold shrink-0">${dBR(a.data)}</span></div>
   <p class="text-xs font-bold mt-1">${esc(a.responsavel||a.prof||'')}${a.freq?` · ${esc(a.freq)} por semana`:''}</p>
   <p class="hint">${n('fis')} físicas · ${n('aqu')} aquáticas · ${n('sce')} socioemocional/cognitivo${a.prox?` · próxima: ${dBR(a.prox)}`:''}</p>
   <div class="flex flex-wrap gap-2 mt-3"><button class="btn !w-auto flex-1 !py-2 !text-xs" onclick="printA('${a.id}')">PDF</button><button class="btn ghost !py-2 !text-xs" onclick="editA('${a.id}')">Editar</button><button class="btn ghost !py-2 !text-xs" style="color:var(--p)" onclick="delA('${a.id}')">Excluir</button></div></div>`}
function evolucaoLongitudinal(l){
  const e=[['fis','Capacidades físicas','o'],['aqu','Habilidades aquáticas','c'],['sce','Socioemocional e cognitivo','p']];
  return `<div class="card" id="evolucao-longitudinal"><div class="flex items-start justify-between gap-2"><div><p class="font-extrabold">Linha do tempo do desenvolvimento</p><p class="hint">Indicadores descritivos por eixo em cada avaliação · escala 0–3. Servem para visualizar tendências, não para diagnosticar.</p></div><span class="mt">${l.length} avaliação(ões)</span></div><div class="mt-4">${l.map((a,i)=>{const prev=l[i-1];return `<div class="relative pl-7 pb-4 ${i===l.length-1?'':'mb-1'}"><span class="absolute left-1 top-1.5 w-3 h-3 rounded-full border-2 border-white shadow" style="background:var(--b)"></span>${i<l.length-1?`<span class="absolute left-[7px] top-4 bottom-0 w-px bg-blue-100 dark:bg-slate-700"></span>`:''}<div class="flex items-center justify-between gap-2 mb-2"><span class="text-xs font-extrabold">${esc(a.tipo)} · ${dBR(a.data)}</span><span class="text-[10px] font-bold text-slate-400">${i+1}/${l.length}</span></div>${e.map(([g,t,c])=>{const v=media(a,[g]),pct=v==null?0:Math.max(0,Math.min(100,v/3*100)),old=prev?media(prev,[g]):null,diff=v!=null&&old!=null?v-old:null;return `<div class="grid grid-cols-[118px_1fr_54px] items-center gap-2 mb-1.5"><span class="text-[10px] font-bold truncate" style="color:var(--${c})">${t}</span>${v==null?`<div class="h-2 rounded-full bg-slate-100 dark:bg-slate-700"></div><span class="text-[10px] font-extrabold text-right text-slate-400">N/C</span>`:`<div class="h-2 rounded-full bg-slate-100 dark:bg-slate-700 overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:var(--${c})"></div></div><span class="text-[10px] font-extrabold text-right">${f1(v)}/3${diff==null?'':` <span style="color:${diff>0?'var(--g)':diff<0?'var(--o)':'#6b7a90'}">${diff>0?'▲':diff<0?'▼':'='}</span>`}</span>`}</div>`}).join('')}</div>`}).join('')}</div></div>`
}
function vAvs(){return pcCard()+vAvsBase()}
function vAvsBase(){const all=ld('a'),st=ld('s').sort((x,y)=>x.nome.localeCompare(y.nome));
  const ids=[...new Set([...st.map(s=>s.id),...all.map(a=>a.aluno)])];
  const opt=alunoOpts();
  let h=`<p class="lb !mt-0">Aluno</p><select class="in" onchange="AS=this.value;render(true)"><option value="">Selecione…</option>${opt}</select>
  <div class="grid grid-cols-2 gap-2 mt-3 mb-4"><button class="btn !py-3 !text-sm" style="background:var(--c)" onclick="expA('csv')">Exportar todas (CSV)</button><button class="btn ghost !py-3 !text-sm" onclick="expA('json')">Exportar todas (JSON)</button></div>`;
  if(!AS)return h+`<p class="hint text-center mt-6">${all.length} avaliação(ões) registradas. Selecione um aluno para acompanhar a evolução física, aquática e socioemocional ao longo do tempo.</p>`;
  const l=evalsOf(AS),s=alu(AS),last=l[l.length-1];
  if(s)h+=`<button class="btn g mb-3" onclick="startAv('${AS}')">+ Nova avaliação para ${esc(s.nome.split(' ')[0])}</button>`;
  if(!l.length)return h+'<p class="hint text-center mt-6">Nenhuma avaliação para este aluno ainda.</p>';
  if(last.prox){const late=last.prox<today();h+=`<div class="card !py-2 text-sm font-bold" style="background:${late?'#fff1e0':'#e9f9e9'};border-color:${late?'#ffd3a6':'#bfeebf'}">${late?'Reavaliação atrasada':'Próxima avaliação prevista'}: ${dBR(last.prox)}</div>`}
  h+=evolucaoLongitudinal(l);
  const G=[['Capacidades físicas',['fis'],'o'],['Habilidades aquáticas',['aqu'],'c'],['Socioemocional / cognitivo',['sce'],'p']];
  const fi=l[0];
  h+=`<div class="card"><p class="font-extrabold mb-2">Evolução ${l.length>1?`${esc(fi.tipo)} → ${esc(last.tipo)}`:'(1ª avaliação)'}</p><div class="grid grid-cols-2 gap-2">${G.map(g=>{const a=media(fi,g[1]),b=media(last,g[1]),max=3,d=a!=null&&b!=null&&l.length>1?b-a:null;
    return `<div class="rounded-xl p-2" style="background:#f5f8ff"><p class="text-[11px] font-extrabold" style="color:var(--${g[2]})">${g[0]}</p><p class="font-extrabold text-lg leading-tight">${l.length>1?`${f1(a)} → `:''}${f1(b)}<span class="text-xs text-slate-400">/${max}</span></p>${d!=null?`<p class="text-xs font-extrabold" style="color:${d>0?'var(--g)':d<0?'var(--o)':'#6b7a90'}">${d>0?'▲ +':d<0?'▼ ':'= '}${f1(d)}</p>`:''}<div class="h-1.5 rounded-full bg-blue-100 dark:bg-slate-700 mt-1"><div class="h-full rounded-full" style="width:${b?b/max*100:0}%;background:var(--${g[2]})"></div></div></div>`}).join('')}</div><p class="hint mt-2">Média dos itens marcados em cada eixo (quanto maior, mais avançado).</p></div>`;
  const rowsOf=(g,items)=>items.filter(x=>l.some(a=>a[g]&&a[g][x])).map(x=>{const v=l.map(a=>a[g]&&a[g][x]),p=l.length>1?[optIdx(g,v[v.length-2]),optIdx(g,v[v.length-1])]:null;
    const tr=p&&p[0]>-1&&p[1]>-1&&p[0]<4&&p[1]<4?(p[1]>p[0]?'<span style="color:var(--g)">▲</span>':p[1]<p[0]?'<span style="color:var(--o)">▼</span>':'<span class="text-slate-400">=</span>'):'';
    return `<tr class="border-t border-blue-50 dark:border-slate-800"><td class="py-1.5 pr-2 text-xs font-bold sticky left-0 bg-white dark:bg-slate-900 min-w-[130px]">${esc(x)}</td>${v.map(y=>`<td class="px-1 text-center">${bd(g,y)}</td>`).join('')}<td class="text-center text-xs font-extrabold">${tr}</td></tr>`}).join('');
  const sec=(t,g,items)=>{const r=rowsOf(g,items);return r?`<tr><td colspan="${l.length+2}" class="pt-3 pb-1 text-xs font-extrabold sticky left-0 bg-white dark:bg-slate-900" style="color:var(--b)">${t}</td></tr>${r}`:''};
  h+=`<div class="card"><p class="font-extrabold">Comparativo das avaliações</p><p class="hint mb-2">Deslize para o lado para ver todas. A última coluna indica a tendência em relação à avaliação anterior.</p><div class="overflow-x-auto -mx-1"><table class="w-full text-left whitespace-nowrap"><thead><tr><th class="sticky left-0 bg-white dark:bg-slate-900"></th>${l.map(a=>`<th class="px-1 text-[10px] font-extrabold text-center leading-tight whitespace-nowrap">${esc(a.tipo)}<br><span class="font-semibold text-slate-400">${dBR(a.data)}</span></th>`).join('')}<th></th></tr></thead><tbody>
   ${['fis','aqu','sce'].map(g=>sec(EIX[g][0],g,EIXI(g))).join('')}</tbody></table></div></div>`;
  return h+`<p class="lb">Avaliações realizadas</p>`+l.slice().reverse().map(a=>avCard(a)).join('')}

/* ----- relatório para impressão / PDF ----- */
function printA(id){const all=ld('a'),a=all.find(x=>x.id==id);if(!a)return;
  const s=alu(a.aluno),pv=prevOf(a),nome=nomeDe(a);
  const mk=(g,items,head)=>`<table><tr><th>Item avaliado</th>${head.map(x=>`<th class="mk">${x}</th>`).join('')}${pv?'<th class="mk">Anterior</th>':''}</tr>${items.map(x=>{const v=a[g]&&a[g][x],j=optIdx(g,v);
    return `<tr><td>${esc(x)}</td>${SG[g][1].map((o,k)=>`<td class="mk" style="${k===j?`background:${colr(o[2])};color:#fff;font-weight:800`:''}">${k===j?'●':''}</td>`).join('')}${pv?`<td class="mk">${pv[g]&&pv[g][x]?esc(SHORT[g]?SHORT[g][optIdx(g,pv[g][x])]:pv[g][x]):'—'}</td>`:''}</tr>`}).join('')}</table>`;
  const box=(t,v)=>`<p style="font-weight:800;margin:8px 0 3px">${t}</p><div class="box">${esc(v)||'<span style="color:#9aa8c0">—</span>'}</div>`;

/* ---- habilidades por nível ---- */

const pHabDesc=h=>{for(const g of pSkills()){const x=g[1].find(y=>y[0]===h);if(x)return x[1]}return ''};
function pSkillSug(g,h){const o=pObj();if(!o)return false;return pNat()?o[3]&&o[3].test(nrm(h[0]+' '+h[1])):!!o[2]&&g===o[2]}
function pFocos(){if(pNat())return[P.nivel];const i=lvIdx(P.faixa);return i<0?[]:TH[i].filter(g=>g[1].some(h=>P.hab.includes(h[0]))).map(g=>g[0])}

/* ---- correspondência habilidade/atividade ---- */
const STOPW=new Set(['com','para','sobre','entre','sem','uma','pelo','pela','como','dos','das','mais','muito']);
const habToks=h=>[...new Set(nrm(h).split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOPW.has(w)).map(w=>w.slice(0,4)))];
const habMatch=(h,txt)=>{const t=habToks(h);if(!t.length)return false;return t.filter(x=>txt.includes(x)).length/t.length>=0.33};
const cogTxt=a=>nrm([a.n,a.d,a.o||'',a.gr,(a.c||[]).join(' ')].join(' '));
const cogMatch=(c,a)=>{const x=PCOG.find(y=>y[0]===c);return !!x&&(x[4].test(cogTxt(a))||(c==='Atenção'&&(a.c||[]).includes('atenção'))||(c==='Tomada de decisão'&&(a.c||[]).includes('tomada de decisão'))||(c==='Memória de trabalho'&&(a.c||[]).includes('memória')))};
const OBJG={'Adaptação e confiança na água':['Ambientação e confiança aquática','Entradas e saídas da água'],'Respiração e imersão':['Respiração aquática','Imersão e submersão'],'Flutuação e orientação':['Flutuação e equilíbrio aquático','Rotação e orientação aquática','Streamline e deslize'],'Propulsão e deslocamento':['Propulsão de pernas','Propulsão de braços','Deslocamento e autonomia aquática'],'Técnica dos nados':['Coordenação dos nados','Propulsão de pernas','Propulsão de braços'],'Segurança e autonomia aquática':['Segurança aquática','Entradas e saídas da água','Deslocamento e autonomia aquática']};
const objMatch=(o,a,txt)=>{if(!o)return false;if(pNat()){if(a.nv&&OBJG[o[0]])return OBJG[o[0]].includes(a.gr);return !!(o[3]&&o[3].test(txt))};return !!o[2]&&(a.k||[]).some(k=>nrm(k).startsWith(nrm(o[2]).slice(0,5)))};
const pLv=()=>({faixa:pNat()?'':P.faixa,nivel:pNat()?P.nivel:'',hab:[]});
function pSug(){const pool=poolDe(pNat()?'N':'B'),o=pObj(),lv=pLv(),out=[];
  pool.forEach(a=>{const L=scoreAtv(a,lv,{});if(L===-1||L.s<0)return;const txt=atvTxt(a),hs=P.hab.filter(h=>habMatch(h,txt)),cs=P.cogOn?P.cogs.filter(c=>cogMatch(c,a)):[],ob=objMatch(o,a,txt);
    if(!hs.length&&!cs.length&&!ob)return;
    const s=L.s+hs.length*25+cs.length*14+(ob?30:0)+(P.cogOn&&(a.k||[]).includes('cognição')?8:0);
    out.push({a,s,hs,cs,ob,fit:L.s>=20})});
  out.sort((x,y)=>y.s-x.s);
