<script>
/* HAPPYFIT KIDS · bases pedagógicas (edite aqui, sem mexer na lógica do app) */
const NIVT=[['Nível 1 · Exploração e organização rudimentar (0–2 anos)','Foco em organizar posturas, deslocamentos iniciais, alcance, manipulação e exploração do espaço. A idade orienta o ponto de partida, mas a habilidade observada define o próximo desafio.'],
['Nível 2 · Fundamental, Iniciação (3–5 anos)','Foco em ampliar estabilidade, locomoção e manipulação por meio de experiências variadas, sem antecipar exigências técnicas.'],
['Nível 3 · Fundamental, Transição (6–7 anos)','Foco em combinar habilidades, ajustar ritmo e direção e resolver tarefas motoras com maior precisão.'],
['Nível 4 · Especializada / Aplicação (8+ anos)','Foco em combinar habilidades com maior precisão, velocidade e complexidade, aproximando-as de contextos esportivos e funcionais.']];
const FAIXAS=NIVT.map(n=>n[0]);const TCL=['g','o','','p'];
const FOCOS=[['Estabilização','Postura, equilíbrio parado e em movimento, giros e aterrissagens','c'],['Locomoção','Deslocar-se, mudar o ritmo, saltar e mudar de direção','g'],['Manipulação','Coordenar olhos e mãos, controlar objetos, arremessar e receber','p']];
const TH=[
[['Estabilização',[['Controle de cabeça e tronco','Fortalece a postura e a sustentação do corpo.'],['Transferência de peso corporal','Prepara para passar o peso de um lado a outro e se deslocar.'],['Equilíbrio sentado e em pé','Ajuda o corpo a se endireitar e a se proteger ao perder o equilíbrio.'],['Rolamento e transição de posturas','Ensina a girar o tronco separado dos quadris.']]],
 ['Locomoção',[['Arrastar e engatinhar','Organiza o movimento cruzado (braço de um lado, perna do outro).'],['Deslocar-se com apoio / caminhar','Conquista o andar em pé e amplia o que a criança enxerga.'],['Transpor pequenos obstáculos','Ensina a levantar o pé e a perceber espaço e altura.']]],
 ['Manipulação',[['Alcançar, agarrar e soltar objetos','Coordena olhos e mãos e a forma de agarrar.'],['Transferir objeto entre as mãos','Cruza o meio do corpo e explora o toque.'],['Empurrar e puxar cargas leves','Força de resposta e firmeza do tronco.']]]],
[['Estabilização',[['Equilíbrio dinâmico em superfícies instáveis','Estimula o equilíbrio e a percepção do próprio corpo.'],['Apoio unipodal breve (saci)','Fortalece tornozelo e quadril e firma o tronco.'],['Agachar, levantar e girar','Mobilidade das pernas e controle do peso do corpo.']]],
 ['Locomoção',[['Correr com paradas repentinas','Aprender a parar e a frear o movimento.'],['Salto bipodal com aterrissagem controlada','Aprender a amortecer o impacto dobrando tornozelo, joelho e quadril.'],['Galopar e saltitar','Ritmo e coordenação entre braços e pernas.']]],
 ['Manipulação',[['Lançar por baixo e por cima','Passar a força do tronco para os braços.'],['Agarrar / receber bola com as duas mãos','Rapidez de reação e leitura do movimento da bola.'],['Chutar e conduzir bola','Equilíbrio em um pé só e coordenação entre olhos e pés.']]]],
[['Estabilização',[['Aterrissagem unipodal estabilizada','Desenvolve controle de alinhamento, estabilidade e organização da aterrissagem.'],['Rotação corporal e dissociação de eixos','Giros e mudanças de direção mais eficientes.']]],
 ['Locomoção',[['Corrida com mudança rápida de direção','Passar rápido de acelerar para frear (agilidade).'],['Combinação de saltos (horizontal + vertical)','Aproveita o impulso do músculo para saltar mais (saltos explosivos).']]],
 ['Manipulação',[['Quicar bola em deslocamento (drible)','Controla a força da batida e o ritmo entre olhos e mãos.'],['Arremesso com precisão no alvo','Ajusta o ângulo de soltar e a força do lançamento.'],['Rebater objeto em movimento','Coordenação olho-mão em velocidade.']]]],
[['Estabilização',[['Estabilidade postural dinâmica sob perturbação','Manter o equilíbrio mesmo quando algo empurra ou desequilibra.']]],
 ['Locomoção',[['Sprint e aceleração explosiva','Usar a máxima força para frente no menor tempo.'],['Sequências locomotoras complexas / percursos','Agilidade mental e planejamento do movimento.']]],
 ['Manipulação',[['Passe e recepção em movimento constante','Decidir rápido com pouco tempo e pouco espaço.'],['Interceptação e direcionamento de alvos','Prever por onde o objeto vai e se antecipar.']]]]];
const COG=[['Sem desafio cognitivo específico','Foco total em fazer bem o movimento.'],['Controle inibitório (sinal verde/vermelho, comandos invertidos)','Treina a segurar o impulso e pensar antes de agir.'],['Memória operacional (memorizar e executar sequências)','Treina guardar informações na cabeça e usá-las na hora.'],['Flexibilidade cognitiva (troca de regras ou papéis)','Treina a se adaptar quando algo muda de repente.']];

<script>
/* HAPPYFIT KIDS · armazenamento local + sincronização Supabase (offline-first, 1 linha por registro) */
const SUPA_URL='https://cpxyptztswiufudpvhkk.supabase.co';
const SUPA_KEY='sb_publishable_1hJ7TirW9jqsnnBNBsNEdw_TPuW5K1s';
const K={s:'hfk_s',b:'hfk_b',r:'hfk_r',a:'hfk_a',c:'hfk_c'},QK='hfk_q';let LP='hfk_lp';const rmLP=()=>Object.keys(localStorage).filter(k=>k.startsWith('hfk_lp')).forEach(k=>localStorage.removeItem(k));
const db=window.supabase?window.supabase.createClient(SUPA_URL,SUPA_KEY):null;
let USER=null,busy=false,again=false,LOCAL=false,SYNC_ERR='',lastUid=null;
const responsavel=()=>{const u=USER||{},m=u.user_metadata||{};return m.full_name||m.name||m.nome||u.email||'Conta HappyFit Kids'};
const semProf=o=>{const{prof,...rest}=o||{};return rest};

/* cada registro local: {...dados, _u:'ISO da última edição', _d:true se apagado (tombstone)} */
const raw=k=>{try{return JSON.parse(localStorage.getItem(K[k]))||[]}catch(e){return[]}};
const ld=k=>raw(k).filter(x=>!x._d);
const clean=x=>{const{_u,_d,...c}=x;return c};
const sig=x=>JSON.stringify(clean(x));
const pend=()=>{try{return JSON.parse(localStorage.getItem(QK))||{}}catch(e){return{}}};
const setPend=p=>localStorage.setItem(QK,JSON.stringify(p));

/* mesma assinatura de antes: sv('s', arrayCompleto). Compara com o que existia e marca só o que mudou. */
function sv(k,v){
  try{
    const old=new Map(raw(k).map(x=>[String(x.id),x])),now=new Date().toISOString(),p=pend(),out=[],seen=new Set();
    v.forEach(x=>{const id=String(x.id),o=old.get(id);seen.add(id);
      if(o&&!o._d&&sig(o)===sig(x)){out.push(o);return}
      out.push({...clean(x),_u:now});p[k+':'+id]=1});
    old.forEach((o,id)=>{if(seen.has(id))return;
      if(o._d)out.push(o);else{out.push({id:o.id,_u:now,_d:true});p[k+':'+id]=1}});
    localStorage.setItem(K[k],JSON.stringify(out));setPend(p);
  }catch(e){toast('Não foi possível salvar neste navegador')}
  flush();paintSync();
}
/* dados antigos (sem _u) entram na fila uma única vez */
function adopt(){const p=pend(),now=new Date().toISOString();
  Object.keys(K).forEach(k=>{let ch=false;const a=raw(k).map(x=>{if(x._u)return x;ch=true;p[k+':'+x.id]=1;return{...x,_u:now}});if(ch)localStorage.setItem(K[k],JSON.stringify(a))});
  setPend(p);limpaEmoji()}

async function flush(){
  if(!db||!USER||!navigator.onLine)return;if(busy){again=true;return}busy=true;paintSync();
  try{
    const keys=Object.keys(pend()),rows=[];
    keys.forEach(pk=>{const i=pk.indexOf(':'),k=pk.slice(0,i),id=pk.slice(i+1),x=raw(k).find(y=>String(y.id)===id);
      if(x)rows.push({user_id:USER.id,tipo:k,id,conteudo:x._d?{}:clean(x),removido:!!x._d,atualizado_em:x._u})});
    if(!rows.length){setPend({});return}
    const ok=[];let fail=null;
    for(const t of [...new Set(rows.map(r=>r.tipo))]){const g=rows.filter(r=>r.tipo===t);
      const{error}=await db.from('registros').upsert(g,{onConflict:'user_id,tipo,id'});if(error)fail=error;else ok.push(...g)}
    const p=pend();   /* só limpa o que foi enviado e não foi editado durante o envio */
    ok.forEach(r=>{const x=raw(r.tipo).find(y=>String(y.id)===r.id);if(!x||x._u===r.atualizado_em)delete p[r.tipo+':'+r.id]});
    setPend(p);SYNC_ERR='';if(fail)throw fail;
  }catch(e){SYNC_ERR=(e&&e.message)||'falha de envio';console.warn('flush',e)}finally{busy=false;paintSync();if(again){again=false;flush()}}
}

/* traz o que mudou na nuvem; por registro vence a edição mais recente (last-write-wins) */
async function pull(){
  if(!db||!USER||!navigator.onLine)return false;
  let changed=false;
  try{
    let since=new Date(Date.parse(localStorage.getItem(LP)||'1970-01-01T00:00:00Z')-12e4).toISOString(); /* folga de 2 min */
    for(;;){
      const{data,error}=await db.from('registros').select('*').eq('user_id',USER.id).gt('sincronizado_em',since).order('sincronizado_em').limit(1000);
      if(error)throw error;if(!data.length)break;
      const p=pend(),by={};data.forEach(r=>(by[r.tipo]=by[r.tipo]||[]).push(r));
      for(const k in by){if(!K[k])continue;const loc=new Map(raw(k).map(x=>[String(x.id),x]));
        by[k].forEach(r=>{const l=loc.get(r.id);if(l&&Date.parse(l._u)>=Date.parse(r.atualizado_em))return;
          loc.set(r.id,r.removido?{id:r.id,_u:r.atualizado_em,_d:true}:{...r.conteudo,_u:r.atualizado_em});delete p[k+':'+r.id];changed=true});
        localStorage.setItem(K[k],JSON.stringify([...loc.values()]))}
      setPend(p);since=data[data.length-1].sincronizado_em;localStorage.setItem(LP,since);
      if(data.length<1000)break;
    }
  }catch(e){SYNC_ERR=(e&&e.message)||'falha ao receber';console.warn('pull',e)}
  return changed}

const EMO=/[\u2600-\u27BF\u2B00-\u2BFF\u23E9-\u23FF\u{1F000}-\u{1FAFF}\u200D\uFE0F]+\s?/gu,HASEMO=/[\u2600-\u27BF\u2B00-\u2BFF\u23E9-\u23FF\u{1F000}-\u{1FAFF}]/u;
function limpaEmoji(){[['s',['nivA','nivT']],['b',['faixa','nivel']],['r',['nivel']]].forEach(([k,fs])=>{let ch=false;
  const n=ld(k).map(x=>{let y=x;fs.forEach(f=>{if(typeof x[f]==='string'&&HASEMO.test(x[f])){y={...y,[f]:x[f].replace(EMO,'').trim()};ch=true}});return y});if(ch)sv(k,n)})}
function syncState(){const n=Object.keys(pend()).length;return LOCAL?['local','Modo local: sem nuvem']:!navigator.onLine?['off',n?`Offline: ${n} item(ns) aguardando envio`:'Offline: tudo salvo neste aparelho']:busy?['sync','Sincronizando…']:SYNC_ERR&&n?['err','Falha ao enviar ('+SYNC_ERR+'). Seus dados estão salvos neste aparelho e serão reenviados.']:n?['pend',`${n} item(ns) aguardando envio`]:['ok','Tudo sincronizado']}

function paintSync(){const e=$('#syn');if(!e)return;const[st,tx]=syncState(),n=Object.keys(pend()).length,cl={ok:'#34d399',sync:'#fbbf24',pend:'#fbbf24',off:'#fb7185',local:'#fb7185',err:'#fb7185'}[st];
  e.innerHTML='<svg viewBox="0 0 24 24" class="w-5 h-5'+(st==='sync'?' animate-pulse':'')+'" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 01-.6-8.96A6 6 0 0118 10.5 3.75 3.75 0 0117.25 18z"/>'+(st==='ok'?'<path d="M9.5 13.5l2 2 3.5-3.5"/>':st==='off'||st==='local'?'<path d="M4 4l16 16"/>':st==='err'?'<path d="M12 9v3M12 15h.01"/>':'')+'</svg>'+`<i style="position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:${cl};border:1.5px solid #fff"></i>`+(n&&st!=='ok'?`<span style="position:absolute;bottom:1px;right:4px;font-size:9px;font-weight:800">${n}</span>`:'');e.title=tx;e.setAttribute('aria-label',tx)}
async function syncAll(){await flush();const ch=await pull();limpaEmoji();if(ch&&$('#modal').classList.contains('hidden'))render(true)}

  }

</script>
<script>/* Manual das Brincadeiras · Deyvison Ribeiro (consulta estática, fora do Supabase) */
const BRINC=[{"id":1,"n":1,"titulo":"Coelhinho Sai da Toca","ambiente":"Funcional","descricao":"As crianças serão distribuídas em grupos de três, sendo duas responsáveis por formar uma toca, enquanto a terceira representa o coelhinho, que ficará dentro dela. Ao comando do recreador, os coelhinhos deverão trocar de toca, enquanto o recreador também tentará ocupar uma das disponíveis. Quem ficar sem toca assume a próxima rodada como coelhinho ou recreador."},{"id":2,"n":2,"titulo":"O Mestre Mandou","ambiente":"Funcional","descricao":"Uma criança ou o recreador será o mestre e dará comandos que os participantes deverão executar somente quando forem precedidos pela expressão “O mestre mandou”. Os comandos podem envolver movimentos corporais, imitações de animais, desafios de equilíbrio ou pequenas tarefas motoras. Quem executar um comando sem a expressão deverá cumprir um desafio divertido."},{"id":3,"n":3,"titulo":"Caça ao Tesouro","ambiente":"Funcional","descricao":"O recreador esconderá pistas ou objetos em uma área delimitada, conduzindo as crianças por uma jornada de descobertas até encontrar o tesouro final. A atividade pode ser realizada individualmente ou em equipes, com desafios motores e enigmas simples entre as etapas."},{"id":4,"n":4,"titulo":"Batatinha Frita, 1, 2, 3","ambiente":"Funcional","descricao":"Uma criança será o guardião e ficará de costas para os demais, dizendo “Batatinha frita, 1, 2, 3!”. Enquanto isso, os participantes avançam em sua direção. Ao terminar a frase, o guardião se vira e todos deverão permanecer imóveis. Quem for visto se movimentando retorna ao ponto de partida. Vence quem alcançar primeiro o guardião."},{"id":5,"n":5,"titulo":"Vampirinho-Vampirão","ambiente":"Funcional","descricao":"Uma criança será escolhida como vampiro e ficará em uma extremidade da área, enquanto os demais participantes aguardam na extremidade oposta. Ao comando do vampiro, todos deverão atravessar o espaço tentando escapar de sua captura. Quem for pego poderá se transformar em ajudante do vampiro ou assumir seu lugar na próxima rodada."},{"id":6,"n":6,"titulo":"Corrida do Saco","ambiente":"Funcional","descricao":"Cada participante deverá entrar em um saco, segurando suas extremidades na altura da cintura. Ao sinal de largada, todos deverão avançar por meio de pequenos saltos até a linha de chegada. Vence quem completar o percurso primeiro, respeitando os limites da pista."},{"id":7,"n":7,"titulo":"Cabo de Guerra","ambiente":"Funcional","descricao":"Duas equipes ficarão posicionadas em lados opostos de uma corda, segurando suas extremidades. Ao sinal do recreador, ambas deverão puxar a corda tentando trazer a marca central para além de sua linha de vitória. A equipe que conseguir deslocar a marca para seu lado vence a rodada."},{"id":8,"n":8,"titulo":"Mão no Cone","ambiente":"Funcional","descricao":"Duas crianças ficarão frente a frente, com um cone posicionado entre elas. O recreador dará comandos relacionados às partes do corpo, como mão na cabeça, mão no joelho, mão no pé ou mão no ombro. Os participantes deverão executar os comandos rapidamente. Quando o recreador disser “CONE!”, ambos tentarão pegar o objeto primeiro."},{"id":9,"n":9,"titulo":"Estátua","ambiente":"Funcional","descricao":"As crianças deverão dançar livremente enquanto a música estiver tocando. Quando ela parar, todos deverão permanecer imóveis, formando uma estátua. Quem se movimentar poderá cumprir um desafio engraçado antes de retornar à brincadeira."},{"id":10,"n":10,"titulo":"Pular Corda e Cobrinha","ambiente":"Funcional","descricao":"Na modalidade tradicional, duas pessoas giram uma corda enquanto os participantes entram e saltam sobre ela, tentando acompanhar seu ritmo sem encostar. Na modalidade cobrinha, o recreador movimenta a corda rente ao chão, imitando uma serpente, e as crianças deverão saltar ou atravessar sem tocá-la."},{"id":11,"n":11,"titulo":"Bandeirinha","ambiente":"Funcional","descricao":"Duas equipes ocuparão lados opostos de uma área dividida ao meio, cada uma protegendo sua bandeira posicionada no próprio campo. O objetivo será invadir o território adversário, capturar a bandeira e levá-la até seu lado sem ser pego. Os participantes capturados poderão ficar em uma área de prisão, aguardando o resgate de um companheiro."},{"id":12,"n":12,"titulo":"Aquecimento com Circuito","ambiente":"Funcional","descricao":"O recreador organizará um percurso com cones, bambolês, cordas e outros materiais. As crianças deverão percorrê-lo realizando diferentes desafios, como saltar dentro das argolas, contornar obstáculos, equilibrar-se e correr até a linha final. O circuito poderá ser repetido com diferentes formas de deslocamento."},{"id":13,"n":13,"titulo":"Lona para Escorregar","ambiente":"Funcional","descricao":"Uma lona será posicionada em uma área plana e preparada com água para permitir o deslizamento. As crianças deverão deslizar sobre ela, individualmente ou em pequenos grupos, utilizando movimentos e posições variadas. A atividade deverá ocorrer em superfície adequada, sem obstáculos e com supervisão constante."},{"id":14,"n":14,"titulo":"Torta na Cara","ambiente":"Funcional","descricao":"Duas equipes participarão de um jogo de perguntas e respostas. Um participante de cada equipe ficará diante de um dispositivo com uma espuma macia ou elemento cenográfico. O recreador fará uma pergunta e quem responder corretamente poderá marcar ponto ou acionar a brincadeira sobre o adversário, conforme a regra estabelecida. A dinâmica deve evitar impactos no rosto e contato com olhos."},{"id":15,"n":15,"titulo":"Guerra de Balão","ambiente":"Funcional","descricao":"As crianças serão divididas em equipes e receberão balões com água. Ao sinal, deverão lançar os balões em direção à área adversária ou realizar desafios de transporte e arremesso em alvos. O objetivo poderá ser acertar alvos, preencher recipientes ou completar uma tarefa coletiva, evitando arremessos no rosto."},{"id":16,"n":16,"titulo":"Raio Laser","ambiente":"Funcional","descricao":"O recreador movimentará uma corda de um lado para o outro, simulando raios laser que atravessam uma área delimitada. As crianças deverão atravessar o espaço desviando da corda, seja abaixando-se, saltando ou passando por baixo dela. Quem for tocado deverá retornar ao início ou cumprir um desafio antes de tentar novamente."},{"id":17,"n":17,"titulo":"Jogo da Velha com Cones","ambiente":"Funcional","descricao":"Duas equipes receberão objetos de cores diferentes, que representarão seus símbolos. Um tabuleiro de jogo da velha será montado no chão com bambolês ou marcações. Ao sinal, um participante de cada equipe correrá até o tabuleiro e posicionará seu objeto em uma das casas. A equipe que formar primeiro uma sequência de três símbolos na horizontal, vertical ou diagonal vence."},{"id":18,"n":18,"titulo":"Acerte o Item (Objeto, Fruta ou Animal)","ambiente":"Funcional","descricao":"Uma criança escolherá secretamente um objeto, fruta, animal ou personagem. Os demais participantes deverão fazer perguntas que possam ser respondidas apenas com “sim” ou “não”, tentando descobrir o item escolhido. Quem acertar será responsável por escolher o próximo elemento."},{"id":19,"n":19,"titulo":"Cidade Dorme","ambiente":"Funcional","descricao":"Os participantes serão distribuídos em papéis secretos, como moradores, detetive e personagem responsável por eliminar jogadores ficticiamente. Durante a rodada, todos fecham os olhos quando o recreador anuncia que a cidade dormiu. Os personagens são chamados individualmente para realizar suas ações, sem revelar suas identidades. Quando a cidade acorda, todos discutem e tentam descobrir quem está causando os acontecimentos. A brincadeira segue até o grupo cumprir seu objetivo."},{"id":20,"n":20,"titulo":"Boca de Forno","ambiente":"Funcional","descricao":"As crianças formam uma roda e respondem ao recreador:\n“Boca de forno!”\n“Forno!”\n“Tirando bolo!”\n“Bolo!”\n“Fareis tudo que seu mestre mandar?”\n“Faremos todos!”\n“Se não fizer?”\n“Levaremos bolo!” Após a cantiga, o recreador dará um desafio que todos deverão cumprir, como buscar um objeto de determinada cor, imitar um animal, formar duplas ou realizar movimentos específicos."},{"id":21,"n":21,"titulo":"Gato-Mia","ambiente":"Funcional","descricao":"Uma criança será escolhida para procurar os demais participantes, permanecendo com os olhos fechados ou vendados em uma área segura. Enquanto isso, os outros se escondem. Quando o procurador encontrar alguém, deverá dizer “Gato mia!”. A criança encontrada deverá miar, e o procurador tentará descobrir quem é apenas pelo som. Se acertar, os papéis serão trocados."},{"id":22,"n":22,"titulo":"Pira-Cola","ambiente":"Funcional","descricao":"Uma criança será o pegador e deverá perseguir os demais participantes. Quando tocar em alguém, deverá dizer “Cola!”, fazendo com que essa pessoa fique parada no lugar. Os outros poderão libertá-la tocando nela e dizendo “Descola!”. O jogo continua até que todos sejam capturados ou até o recreador encerrar a rodada."},{"id":23,"n":23,"titulo":"Pira Alta","ambiente":"Funcional","descricao":"Uma criança será o pegador e tentará capturar os demais participantes. Para escapar, os fugitivos poderão subir em estruturas baixas e seguras ou ocupar espaços previamente definidos como áreas altas. Quem estiver protegido não poderá ser pego enquanto permanecer no local. O recreador deverá estabelecer previamente quais superfícies são permitidas."},{"id":24,"n":24,"titulo":"Mãe da Rua","ambiente":"Funcional","descricao":"Uma criança será a mãe da rua e ficará no centro de uma área delimitada. Os demais participantes ficarão em uma extremidade e deverão atravessar até o outro lado quando ela autorizar. Durante a travessia, a mãe da rua tentará capturar os participantes. Quem for pego poderá ajudá-la nas próximas rodadas. Vence quem conseguir atravessar sem ser capturado até o final."},{"id":25,"n":25,"titulo":"Chão é Lava","ambiente":"Funcional","descricao":"O recreador anunciará que o chão se transformou em lava e as crianças deverão se deslocar utilizando apenas os locais seguros previamente demarcados, como bambolês, tatames ou placas. Ao comando, poderão trocar de posição, atravessar o percurso ou encontrar novos refúgios sem tocar no chão proibido."},{"id":26,"n":26,"titulo":"Reloginho","ambiente":"Funcional","descricao":"Uma corda será amarrada a um cone ou segurada pelo recreador, que a movimentará circularmente próxima ao chão, como os ponteiros de um relógio. As crianças deverão atravessar o espaço ou resgatar um objeto sem serem tocadas pela corda. A cada rodada, a velocidade ou a direção poderá ser modificada."},{"id":27,"n":27,"titulo":"Mate o Rei","ambiente":"Funcional","descricao":"Uma variação estratégica da queimada tradicional, na qual duas equipes recebem papéis secretos inspirados nas peças do xadrez.\n• Rei: personagem principal; sua eliminação encerra a partida.\n• Rainha: possui uma regra especial de resistência, sendo eliminada apenas quando atingida nas regiões definidas previamente.\n• Cavalo: possui duas vidas, podendo continuar após o primeiro acerto.\n• Torre: atua como protetor do Rei, conforme as regras estabelecidas.\n• Bispo: ao ser atingido, elimina também o jogador responsável pelo arremesso, saindo ambos da rodada.\n• Peão: não possui habilidades especiais e é eliminado ao ser atingido. Os papéis serão distribuídos secretamente e cada equipe deverá proteger seu Rei enquanto tenta descobrir e eliminar o adversário. A partida exige estratégia, atenção e cooperação."},{"id":28,"n":28,"titulo":"Pega-Pega Caçador","ambiente":"Funcional","descricao":"O caçador conduzirá a brincadeira dando comandos que as crianças deverão imitar.\n• Tartaruga: abaixar-se e proteger o corpo com os braços.\n• Estrela-do-mar: abrir braços e pernas.\n• Tubarão: unir os pés e formar uma barbatana com os braços.\n• Estrela saltitante: realizar um polichinelo.\n• Mergulhador: agachar-se e colocar uma mão no nariz. Quando o caçador gritar “CAÇADOR!”, todos deverão correr até o refúgio demarcado, enquanto ele tenta capturar os participantes antes que alcancem a segurança."},{"id":29,"n":29,"titulo":"Ameba","ambiente":"Funcional","descricao":"Uma variação da queimada jogada individualmente, em que todos começam como jogadores ativos. Quem for atingido pela bola deverá se abaixar no local e se transformar em uma ameba. A ameba poderá retornar ao jogo se conseguir tocar em um participante que passar próximo ou acertar alguém com a bola, quando estiver ao seu alcance. Nesse caso, os jogadores trocam de condição. Os participantes que estiverem com a bola não poderão se deslocar enquanto a seguram. O jogo termina quando restar apenas um jogador em pé."},{"id":30,"n":30,"titulo":"Foguete-Estátua","ambiente":"Funcional","descricao":"O recreador dará comandos que as crianças deverão executar rapidamente:\n• Foguete: unir as mãos acima da cabeça e manter as pernas juntas.\n• Avião: abrir os braços e as pernas, imitando as asas.\n• Estátua: permanecer imóvel na pose mais criativa possível. Os comandos poderão ser alternados rapidamente, exigindo atenção, coordenação e controle corporal."},{"id":31,"n":31,"titulo":"Gelinho-Gelão","ambiente":"Funcional","descricao":"Uma criança será o pegador e tentará capturar os demais. Quando tocar em alguém, deverá escolher entre duas formas de congelamento:\n• Gelinho: o participante deverá agachar-se e poderá ser salvo por alguém que saltar sobre ele.\n• Gelão: o participante deverá ficar em pé com as pernas afastadas e poderá ser salvo por alguém que passar por baixo delas. A brincadeira continua até que todos sejam congelados ou até o encerramento da rodada."},{"id":32,"n":32,"titulo":"Sete Pecados","ambiente":"Funcional","descricao":"Uma criança ficará responsável pela bola e deverá lançá-la para cima enquanto fala o nome de um dos participantes. A criança chamada deverá tentar pegar a bola antes que ela toque o chão, enquanto os demais se afastam. Quando conseguir segurá-la, todos deverão parar imediatamente. O participante com a bola poderá dar até sete passos em direção a outro jogador e realizar um arremesso controlado abaixo da linha dos ombros. Quem for atingido assumirá a função de lançar a bola na próxima rodada."},{"id":33,"n":33,"titulo":"Corre-Cotia","ambiente":"Funcional","descricao":"As crianças formarão uma roda e permanecerão sentadas. Uma delas caminhará ao redor do círculo com um objeto na mão, enquanto todos cantam “Corre cotia, na casa da tia...”. Discretamente, deixará o objeto atrás de alguém. Ao perceber, a criança deverá levantar e correr atrás de quem deixou o objeto, tentando alcançá-la antes que ela ocupe seu lugar na roda."},{"id":34,"n":34,"titulo":"Elefante Colorido","ambiente":"Funcional","descricao":"O recreador será o elefante e dirá: “Elefante colorido!”. As crianças responderão: “Que cor?”. O recreador anunciará uma cor e todos deverão correr para tocar em algum objeto daquela tonalidade antes de serem alcançados pelo pegador."},{"id":35,"n":35,"titulo":"Amarelinha","ambiente":"Funcional","descricao":"Será desenhada uma sequência de casas numeradas no chão. Cada criança deverá lançar uma pedrinha ou marcador em uma das casas e percorrer o trajeto saltando em um pé ou com os dois pés, conforme a disposição das casas, sem pisar nas linhas ou na casa ocupada pelo objeto. Vence quem completar o percurso corretamente."},{"id":36,"n":36,"titulo":"Morto-Vivo","ambiente":"Funcional","descricao":"As crianças ficarão em pé diante do recreador. Ao comando “VIVO!”, deverão permanecer em pé; ao comando “MORTO!”, deverão agachar-se. O recreador alternará os comandos e poderá aumentar a velocidade ou utilizar palavras para confundir os participantes. Quem errar poderá cumprir um desafio e retornar ao jogo."},{"id":37,"n":37,"titulo":"Queimada Tradicional","ambiente":"Funcional","descricao":"Duas equipes ocuparão campos opostos, com uma bola macia. O objetivo será acertar os integrantes adversários abaixo da linha dos ombros, respeitando as regras estabelecidas. Quem for atingido poderá ir para uma área de reserva ou cumprir uma condição de retorno. Vence a equipe que conseguir eliminar todos os adversários ou alcançar a meta de pontos."},{"id":38,"n":38,"titulo":"Pega-Pega Corrente","ambiente":"Funcional","descricao":"Uma criança começa como pegador. Cada participante capturado deverá dar as mãos ao pegador, formando uma corrente que continuará perseguindo os demais. A corrente deverá se deslocar unida, tentando capturar todos os participantes. O último a ser pego poderá iniciar a próxima rodada."},{"id":39,"n":39,"titulo":"Passa-Anel","ambiente":"Funcional","descricao":"As crianças ficarão sentadas em roda, com as mãos unidas e ligeiramente abertas. Uma delas receberá um anel ou pequeno objeto e deverá fingir que o coloca nas mãos de todos, deixando-o discretamente com apenas um participante. Ao final, perguntará quem está com o anel. Quem acertar será o próximo distribuidor."},{"id":40,"n":40,"titulo":"Telefone sem Fio","ambiente":"Funcional","descricao":"As crianças ficarão organizadas em fila ou roda. O recreador sussurrará uma frase no ouvido do primeiro participante, que deverá repassá-la ao próximo, sem repetir. A mensagem seguirá até o último, que falará em voz alta o que recebeu. O grupo comparará a frase final com a original."},{"id":41,"n":41,"titulo":"Dança das Cadeiras","ambiente":"Funcional","descricao":"Serão organizadas cadeiras em círculo, sempre com uma cadeira a menos que o número de participantes. Enquanto a música tocar, todos deverão circular ao redor delas. Quando a música parar, cada criança tentará ocupar uma cadeira. Quem ficar sem lugar sairá da rodada, retirando-se também uma cadeira. A brincadeira continua até restar um vencedor."},{"id":42,"n":42,"titulo":"Elástico","ambiente":"Funcional","descricao":"Dois participantes ficarão posicionados segurando um elástico ao redor das pernas, enquanto outro deverá realizar uma sequência de saltos e movimentos previamente combinados. A altura do elástico poderá aumentar progressivamente, conforme a habilidade dos participantes. Quem completar a sequência poderá avançar de nível."},{"id":43,"n":43,"titulo":"Alerta Cor","ambiente":"Funcional","descricao":"Uma criança ficará com uma bola e as demais se distribuirão pela área. Ela lançará a bola para cima e gritará “ALERTA COR!”, anunciando uma cor. Os participantes deverão correr para tocar em algo daquela cor. A criança com a bola tentará acertar um jogador com um lançamento controlado antes que ele alcance o refúgio."},{"id":44,"n":44,"titulo":"Pique-Bandeira com Resgate","ambiente":"Funcional","descricao":"Duas equipes terão uma base e um objeto representando a bandeira. O objetivo será invadir o campo adversário, capturar a bandeira e retornar à própria base. Quem for pego no território rival deverá permanecer em uma área de prisão, podendo ser libertado por um companheiro que consiga tocá-lo."},{"id":45,"n":45,"titulo":"Pula-Carniça","ambiente":"Funcional","descricao":"Os participantes formarão uma fila, mantendo distância segura. O primeiro ficará inclinado, com as mãos apoiadas nos joelhos, enquanto o próximo deverá apoiar as mãos em suas costas e saltar por cima dele, afastando-se após aterrissar. A brincadeira prossegue com os demais participantes, respeitando a capacidade motora e a segurança de cada criança."},{"id":46,"n":46,"titulo":"Corrida do Ovo na Colher","ambiente":"Funcional","descricao":"Cada participante receberá uma colher com um ovo cozido ou uma bolinha leve. Ao sinal, deverá percorrer um trajeto equilibrando o objeto sem deixá-lo cair. Se cair, deverá recolocá-lo na colher e continuar. Vence quem completar o percurso primeiro."},{"id":47,"n":47,"titulo":"Adoleta","ambiente":"Funcional","descricao":"As crianças formarão uma roda e colocarão as mãos sobre as mãos dos colegas. Enquanto cantam a música tradicional da brincadeira, uma criança deverá bater levemente na mão do participante seguinte, seguindo o ritmo da cantiga. A dinâmica prossegue até o encerramento da sequência combinada."},{"id":48,"n":48,"titulo":"Seu Lobo","ambiente":"Funcional","descricao":"Uma criança será o lobo e ficará afastada do grupo. As demais perguntarão em coro: “Vamos passear no bosque enquanto seu lobo não vem?”. O lobo responderá com ações de preparação, como “Estou colocando a camisa”, “Estou calçando os sapatos”. Quando disser\n“Estou pronto!”, correrá atrás das crianças, que deverão fugir até o refúgio."},{"id":49,"n":49,"titulo":"Pega-Pega Congelante com Bola","ambiente":"Funcional","descricao":"O pegador utilizará uma bola macia para tentar tocar os demais participantes com lançamentos abaixo dos ombros. Quem for atingido ficará congelado no lugar, podendo ser libertado quando outro participante tocar nele. O objetivo será congelar todos antes que o tempo termine."},{"id":50,"n":50,"titulo":"Corrida de Três Pernas","ambiente":"Funcional","descricao":"As crianças formarão duplas e terão uma das pernas de cada participante unida por uma faixa macia. Ao sinal, deverão percorrer um trajeto coordenando os passos para chegar à linha final. A dupla deverá manter a união durante todo o percurso."},{"id":51,"n":1,"titulo":"Marco-Polo","ambiente":"Natação","descricao":"Uma criança será escolhida como procuradora e deverá localizar os demais participantes por meio das vozes e dos sons produzidos na água. Ela chamará “Marco!”, enquanto os outros responderão “Polo!”. O objetivo será encontrar e tocar um dos participantes dentro de uma área delimitada. A atividade deverá ser realizada sem venda nos olhos, em profundidade compatível com os participantes e com supervisão individual adequada."},{"id":52,"n":2,"titulo":"Salto Maluco","ambiente":"Natação","descricao":"As crianças deverão realizar saltos criativos a partir da borda ou de uma plataforma baixa autorizada, utilizando diferentes posições corporais, como estrela, foguete ou salto com braços abertos. A atividade deverá ser realizada somente em locais com profundidade apropriada, entrada controlada e autorização do professor."},{"id":53,"n":3,"titulo":"Caça-Letra ou Número","ambiente":"Natação","descricao":"Letras ou números flutuantes serão espalhados pela piscina. Ao comando do recreador, as crianças deverão localizar e recolher o elemento solicitado, levando-o até o ponto de entrega. A atividade poderá envolver identificação de letras, formação de palavras ou sequências numéricas."},{"id":54,"n":4,"titulo":"Enchendo o Pote","ambiente":"Natação","descricao":"As crianças serão divididas em equipes e receberão esponjas e recipientes vazios. Deverão mergulhar ou molhar as esponjas, transportando a água até os potes e espremendo-as dentro deles. Vence a equipe que atingir primeiro a marca estabelecida."},{"id":55,"n":5,"titulo":"Passa a Bola","ambiente":"Natação","descricao":"As crianças formarão filas dentro da piscina e deverão passar uma bola para o colega seguinte, alternando movimentos por cima da cabeça e entre as pernas, conforme o comando. A equipe que conseguir transportar a bola até o último participante primeiro vence a rodada."},{"id":56,"n":6,"titulo":"Travessia Maluca","ambiente":"Natação","descricao":"Os participantes deverão atravessar a piscina de diferentes maneiras, conforme os comandos do recreador, como caminhar lateralmente, deslocar-se com braços abertos, realizar pernadas segurando uma prancha ou nadar determinado estilo. A atividade poderá ser realizada individualmente ou em equipes."},{"id":57,"n":7,"titulo":"Passa no Túnel","ambiente":"Natação","descricao":"As crianças formarão uma fila ou túnel com as pernas afastadas, em uma profundidade segura. O último participante deverá deslocar-se até a frente passando por baixo dos braços ou entre as pernas dos colegas, conforme a adaptação. A dinâmica continua até que todos tenham participado."},{"id":58,"n":8,"titulo":"Atrás da Mesma Bola","ambiente":"Natação","descricao":"Uma bola será posicionada em um ponto previamente determinado da piscina. Ao sinal do recreador, os participantes deverão deslocar-se até ela e tentar alcançá-la primeiro. A brincadeira poderá ser adaptada para duplas ou equipes, com deslocamento por natação ou caminhada em água rasa."},{"id":59,"n":9,"titulo":"Estátua Aquática","ambiente":"Natação","descricao":"As crianças deverão movimentar-se livremente na água enquanto a música tocar. Quando o recreador anunciar “ESTÁTUA!”, todos deverão interromper os movimentos e permanecer na posição solicitada, como estrela, foguete ou equilíbrio com braços abertos."},{"id":60,"n":10,"titulo":"Procurando Nemo","ambiente":"Natação","descricao":"Bambolês ou objetos flutuantes serão distribuídos pela piscina, representando as casinhas dos participantes. Ao comando, as crianças deverão trocar de casinha, enquanto o recreador tenta ocupar uma delas. Quem ficar sem espaço deverá conduzir a próxima rodada."},{"id":61,"n":11,"titulo":"Corrida Submarina","ambiente":"Natação","descricao":"Os participantes deverão realizar deslocamentos subaquáticos curtos, com controle respiratório e sem competição de apneia. A atividade poderá ser proposta como busca de objetos em profundidade apropriada ou passagem por um arco submerso, respeitando o nível de habilidade de cada criança. Não deverão ser realizadas disputas para ver quem permanece mais tempo sem respirar."},{"id":62,"n":12,"titulo":"Polvo","ambiente":"Natação","descricao":"Uma criança será escolhida como polvo e ficará posicionada no centro da piscina. Os demais deverão atravessar de um lado ao outro sem serem tocados. Quem for capturado passará a integrar o polvo, ajudando a capturar os demais. A brincadeira termina quando todos forem alcançados."},{"id":63,"n":13,"titulo":"Cabo de Guerra Aquático","ambiente":"Natação","descricao":"Duas equipes ficarão posicionadas em lados opostos, segurando uma corda apropriada para uso aquático. Ao sinal, deverão puxar de maneira coordenada, tentando deslocar a marca central em direção ao seu campo. A atividade deverá ser realizada em água rasa, sem enrolar a corda no corpo e sem puxões bruscos."},{"id":64,"n":14,"titulo":"Vôlei Adaptado (Salve)","ambiente":"Natação","descricao":"Duas equipes ficarão posicionadas em lados opostos da piscina, separadas por uma linha ou rede imaginária. O objetivo será lançar a bola para o campo adversário e mantê-la em sua área de jogo. Se a bola permanecer no campo adversário por cinco segundos sem ser devolvida, a equipe que a lançou marcará um ponto. A dinâmica poderá ser adaptada para permitir uma ou mais tentativas de defesa."},{"id":65,"n":15,"titulo":"Caça ao Tesouro Aquático","ambiente":"Natação","descricao":"O recreador espalhará brinquedos flutuantes ou objetos apropriados em uma área delimitada. Ao sinal, as crianças deverão procurar e recolher os tesouros, transportando-os até um recipiente ou ponto de entrega. A atividade poderá ser realizada por cores, formas ou quantidade de objetos."},{"id":66,"n":16,"titulo":"Corrida das Esponjas","ambiente":"Natação","descricao":"Duas ou mais equipes receberão uma esponja e um recipiente vazio. O primeiro participante deverá molhar a esponja, transportá-la até o recipiente e espremê-la, retornando para entregar a esponja ao próximo colega. Vence a equipe que completar primeiro a quantidade de água estipulada."},{"id":67,"n":17,"titulo":"Pega-Pega Aquático","ambiente":"Natação","descricao":"Uma criança será o pegador e deverá perseguir os demais participantes dentro de uma área delimitada. Quem for tocado assumirá a função de pegador ou ficará congelado até ser libertado por outro colega. A atividade deverá ocorrer em profundidade adequada à capacidade de todos."},{"id":68,"n":18,"titulo":"Tubarão e Peixinhos","ambiente":"Natação","descricao":"Uma criança será o tubarão e ficará em uma extremidade da piscina, enquanto os demais serão peixinhos. Ao comando “Peixinhos, atravessem!”, todos deverão deslocar-se até o outro lado tentando evitar o tubarão. Quem for capturado poderá tornar-se ajudante do tubarão."},{"id":69,"n":19,"titulo":"Corrida de Pranchas","ambiente":"Natação","descricao":"Os participantes utilizarão pranchas para realizar deslocamentos por meio de pernadas, mantendo a posição corporal adequada. O percurso poderá ser feito individualmente ou em equipes, com a finalidade de alcançar uma marca determinada."},{"id":70,"n":20,"titulo":"Entrega do Tesouro","ambiente":"Natação","descricao":"Os participantes receberão um objeto flutuante que deverá ser transportado de um ponto a outro da piscina utilizando diferentes formas de deslocamento, como pernadas com prancha, nado ou caminhada em água rasa. O objetivo será entregar o objeto sem deixá-lo escapar."},{"id":71,"n":21,"titulo":"Bola ao Cesto Aquático","ambiente":"Natação","descricao":"Um cesto ou alvo flutuante será posicionado na piscina. As crianças deverão realizar lançamentos com bolas leves, tentando acertar o alvo. Cada acerto valerá um ponto, e a distância poderá ser ajustada conforme a habilidade dos participantes."},{"id":72,"n":22,"titulo":"Siga o Mestre Aquático","ambiente":"Natação","descricao":"O recreador realizará movimentos dentro da água, como bater pernas, abrir os braços, realizar deslocamentos laterais, girar ou fazer bolhas. As crianças deverão imitar os movimentos, acompanhando a sequência e o ritmo propostos."},{"id":73,"n":23,"titulo":"Corrida dos Animais Aquáticos","ambiente":"Natação","descricao":"O recreador anunciará um animal e as crianças deverão atravessar a piscina imitando seu movimento.\n• Sapo: pequenos saltos na água rasa.\n• Caranguejo: deslocamento lateral.\n• Peixe: pernadas com braços estendidos.\n• Golfinho: ondulação corporal adaptada ao nível de habilidade.\n• Polvo: deslocamento com movimentos amplos dos braços."},{"id":74,"n":24,"titulo":"Ilha dos Bambolês","ambiente":"Natação","descricao":"Bambolês flutuantes ou estruturas apropriadas serão distribuídos pela piscina, representando ilhas. As crianças deverão deslocar-se entre elas conforme os comandos do recreador. Quando ele anunciar “TEMPORAL!”, todos deverão procurar uma ilha disponível."},{"id":75,"n":25,"titulo":"Revezamento Aquático","ambiente":"Natação","descricao":"As crianças serão divididas em equipes e posicionadas em filas. O primeiro participante deverá atravessar um percurso previamente definido, tocar na borda ou entregar um objeto ao próximo colega. A equipe que concluir o revezamento primeiro vence."},{"id":76,"n":26,"titulo":"Bolhas de Sabão Aquáticas","ambiente":"Natação","descricao":"Em uma área rasa, o recreador convidará as crianças a realizar expirações na água, produzindo bolhas. Poderão ser propostos desafios como fazer bolhas grandes, pequenas ou contínuas, sempre respeitando o conforto e a capacidade respiratória de cada participante."},{"id":77,"n":27,"titulo":"Resgate dos Bichinhos","ambiente":"Natação","descricao":"Brinquedos flutuantes em formato de animais serão espalhados pela piscina. As crianças deverão resgatar os bichinhos e transportá-los até uma área segura, utilizando diferentes formas de deslocamento. A atividade poderá envolver identificação dos animais e separação por categorias."},{"id":78,"n":28,"titulo":"Corrida do Barquinho","ambiente":"Natação","descricao":"Cada criança receberá um barquinho flutuante. Ao sinal, deverá conduzi-lo até a linha de chegada utilizando sopros ou movimentos suaves da água com as mãos, sem empurrá-lo diretamente. Vence quem conseguir levar o barquinho primeiro ao destino."},{"id":79,"n":29,"titulo":"Caça às Cores","ambiente":"Natação","descricao":"Objetos de diferentes cores serão espalhados pela piscina. O recreador anunciará uma cor, e as crianças deverão encontrar um objeto correspondente e levá-lo até o ponto de coleta. Poderão ser criadas rodadas individuais ou cooperativas."},{"id":80,"n":30,"titulo":"Passa-Bola em Círculo","ambiente":"Natação","descricao":"As crianças formarão um círculo dentro da piscina e deverão passar uma bola de mão em mão, sem deixá-la escapar. Ao comando do recreador, a direção será invertida ou a bola deverá passar por cima da cabeça. O objetivo será manter a sequência pelo maior número de passes possível."}];</script>

  const rows=bs.map(b=>{const r=rs.find(x=>x.link==b.id);return [fmt(b.data),tp(b),nomeDe(b),b.responsavel||b.prof||'—',b.faixa||b.nivel,fo(b),b.hab.join('; '),b.cog,b.det.join('; '),r?'Com relatório':'Pendente',r&&rScore(r)!=null?fScore(rScore(r)):'',r?.part,r?.aten,r?.exec,r?.cont,r?.resp,r?.auto,(r?.habs||[]).join('; '),...NATALL.map(m=>r?.[m[0]]),(r?.destaques||[]).join('; '),r?.obs_pais||'',r?.obs_interna||'',r?.adesao,r?.nivel,r?.eng,r?.seg].map(q).join(',')});
  dl('happyfit-sessoes.csv','\ufeff'+[hd.map(q).join(','),...rows].join('\n'),'text/csv;charset=utf-8')}
const TIPOS_IMP=[['s','alunos','alunos'],['b','briefings','sessões'],['r','relatorios','relatórios'],['a','avaliacoes','avaliações'],['c','checkins','aulas e faltas']];let IMPD=null;
function imp(f){if(!f)return;const rd=new FileReader();rd.onerror=()=>toast('Não foi possível ler o arquivo.');
  rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(e){return toast('Arquivo inválido: não é um backup do HappyFit Kids.')}
    if(!d||typeof d!=='object'||Array.isArray(d)||!TIPOS_IMP.some(t=>t[1] in d))return toast('Arquivo inválido: nenhum dado do HappyFit Kids encontrado.');
    const dados={},pres={};let tot=0,bad=0;TIPOS_IMP.forEach(([k,n])=>{pres[k]=n in d;const a=Array.isArray(d[n])?d[n]:[];dados[k]=a.filter(x=>x&&typeof x==='object'&&x.id!=null&&!x._d);bad+=a.length-dados[k].length;tot+=dados[k].length});
    if(!tot)return toast('O backup não contém registros válidos.');
    IMPD={dados,pres,brinc:Array.isArray(d.brincadeiras)?d.brincadeiras.filter(x=>x&&x.id!=null&&x.titulo):[]};
    $('#modal').innerHTML=`<div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-5 max-h-[92vh] overflow-auto"><h2>Importar backup</h2><p class="hint mb-2">No arquivo: ${TIPOS_IMP.filter(t=>dados[t[0]].length).map(t=>dados[t[0]].length+' '+t[2]).join(' · ')}${IMPD.brinc.length?' · '+IMPD.brinc.length+' brincadeira(s)':''}${bad?`. ${bad} item(ns) inválido(s) serão ignorados`:''}.</p>
    <p class="text-sm font-bold">Mesclar (recomendado): adiciona o que falta e não altera o que já existe aqui.</p><p class="text-sm font-bold mt-1">Substituir: troca os dados pelos do arquivo. Uma cópia dos dados atuais é baixada antes.</p>
    <div class="grid gap-2 mt-4"><button class="btn g" onclick="aplicaImp('mesclar')">Mesclar</button><button class="btn ghost" style="color:var(--o)" onclick="aplicaImp('substituir')">Substituir tudo</button><button class="btn ghost" onclick="closeM()">Cancelar</button></div></div>`;$('#modal').classList.remove('hidden')};rd.readAsText(f)}
function aplicaImp(modo){if(!IMPD)return;const{dados,pres,brinc}=IMPD;
  if(modo==='substituir'){dl('happyfit-antes-da-importacao.json',JSON.stringify({alunos:ld('s'),briefings:ld('b'),relatorios:ld('r'),avaliacoes:ld('a'),checkins:ld('c'),brincadeiras:customBrinc()},null,2),'application/json');
    TIPOS_IMP.forEach(([k])=>{if(pres[k])sv(k,dados[k])});if(brinc.length)saveCustomBrinc(brinc)}
  else{TIPOS_IMP.forEach(([k])=>{const tem=new Set(ld(k).map(x=>String(x.id))),novos=dados[k].filter(x=>!tem.has(String(x.id)));if(novos.length)sv(k,[...ld(k),...novos])});
    if(brinc.length){const tem=new Set(customBrinc().map(x=>String(x.id)));saveCustomBrinc([...customBrinc(),...brinc.filter(x=>!tem.has(String(x.id)))])}}
  IMPD=null;closeM();toast(modo==='substituir'?'Backup importado. Os dados anteriores foram baixados antes.':'Backup mesclado com os dados atuais.');render(true)}
function clr(){if(confirm('Limpar o cache DESTE aparelho? Os dados na nuvem não são apagados e voltam na próxima sincronização.')){Object.values(K).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(QK);rmLP();['hfk_adraft','hfk_bdraft','hfk_ndraft'].forEach(k=>localStorage.removeItem(k));localStorage.removeItem(CUSTOM);localStorage.removeItem(FAV);A=newA();R=newR();B=newB();N=newN();step=1;ns=1;render();toast('Cache local limpo.')}}
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js?v=4').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Nova versão instalada. Feche e abra o app para usar.')})});return r.update()}).catch(()=>{});let _er=0;['error','unhandledrejection'].forEach(t=>addEventListener(t,()=>{if(Date.now()-_er>8000){_er=Date.now();toast('Algo não saiu como esperado. Seus dados continuam salvos neste aparelho.')}}));$('#lgh').src=LOGO_W;paintSync();$('#lgl').src=LOGO_C;$('#lgl2').src=LOGO_W;paintTheme();render();if(MODO_TESTE){const tb=$('#tbanner');if(tb)tb.classList.add('on')}else{const tb=$('#tbanner');if(tb)tb.remove()}
boot();
</script>
